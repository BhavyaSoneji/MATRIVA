# Public-health guidance entries, paraphrased from the cited primary sources.
#
# Same schema as seed.yaml. Every entry is PENDING_SOURCE_VERIFICATION: the wording is a
# short paraphrase written for this project, it has NOT been checked line-by-line by a
# clinician, and the ingestion script loads it as review_status=pending. Nothing here
# reaches chat answers until a reviewer approves it in the admin screen
# (POST /admin/documents/{id}/approve). `url` points at the primary source to verify against.
#
# Topic names deliberately avoid the substring "anc": the ingestion script uses it to
# decide when to create a structured Guideline row.

- document_id: guide-who-iron-folate-001
  title: "WHO: Daily Iron and Folic Acid Supplementation in Pregnancy"
  content: >
    WHO's antenatal-care recommendations advise daily oral iron and folic acid for pregnant
    women, at 30-60 mg of elemental iron and 400 micrograms (0.4 mg) of folic acid, to
    prevent maternal anaemia, low birth weight and preterm birth. Dose and duration should be
    set by the woman's own care provider, especially if she is already anaemic.
  domain: MODERN_MEDICAL
  subdomain: supplements
  source_id: who-antenatal-2016
