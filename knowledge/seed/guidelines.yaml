- document_id: guide-nin-iron-001
  title: "ICMR-NIN: Iron in Pregnancy - Foods, Absorption and Supplements"
  content: >
    ICMR-NIN explains that iron is needed to make haemoglobin, and that iron deficiency in pregnancy raises the risk of maternal death and low-birth-weight babies. Green leafy vegetables, legumes and dry fruits contain iron, and meat, fish and poultry also provide it; iron is poorly absorbed from plant foods but well absorbed from animal foods. Vitamin C-rich fruits such as amla (gooseberry), guava and citrus improve absorption of iron from plant foods. Tea binds iron, so it should be avoided before, during or soon after a meal. Commonly eaten plant-based Indian diets provide roughly 18 mg of iron a day against a recommended intake of 35 mg, so ICMR-NIN recommends iron supplementation of 100 mg elemental iron with 0.5 mg folic acid for 100 days of pregnancy from the 16th week onwards.
