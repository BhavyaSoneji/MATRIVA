- document_id: guide-nin-folic-001
  title: "ICMR-NIN: Folic Acid and Folate-Rich Foods"
  content: >
    ICMR-NIN notes that folic acid is essential for making haemoglobin and that pregnant women need more of it. Green leafy vegetables, legumes, nuts and liver are good sources of folate. Folic acid supplements increase birth weight and reduce congenital anomalies such as neural tube defects. A dose of 0.5 mg of folic acid is advised before conception and throughout pregnancy for women with a history of congenital anomalies such as neural tube defects or cleft palate.
