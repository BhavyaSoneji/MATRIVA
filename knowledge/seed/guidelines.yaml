- document_id: guide-nhs-healthy-diet-001
  title: "NHS: Healthy Eating in Pregnancy"
  content: >
    NHS advises that you do not need a special diet in pregnancy and you do not need to eat for two, but you should eat a variety of foods every day and get the balance right over a week. Eat at least 5 portions of fruit and vegetables a day. Starchy foods such as bread, rice, potatoes, oats and millet should make up just over a third of what you eat, and wholegrain choices are better. Eat some protein every day, from beans, pulses, fish, eggs, poultry, nuts or lean meat, but avoid liver. Aim for 2 portions of fish a week, one of them oily, and no more than 2 portions of oily fish a week. Dairy foods such as milk, curd and yoghurt are important for calcium, and low-fat choices are best. Have foods high in fat or sugar less often and in small amounts, and cook meat, poultry and eggs thoroughly.
