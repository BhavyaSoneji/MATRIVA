- document_id: guide-nin-extra-food-001
  title: "ICMR-NIN: Extra Food and Nutrients During Pregnancy"
  content: >
    ICMR-NIN's Dietary Guidelines for Indians say a pregnant woman needs extra food, because pregnancy is a nutritionally demanding period. Her daily diet should contain an additional 350 calories, plus 0.5 g of extra protein in the first trimester, 6.9 g in the second trimester and 22.7 g in the third trimester. Healthy weight gain over pregnancy is about 10-12 kg, and a well-fed mother usually gains around 10 kg. Folic acid, iron, calcium, iodine, vitamin A, vitamin C and vitamin B12 are the nutrients that need special attention. There is no need to change the usual dietary pattern; the quantity and frequency of foods should simply increase.
