- document_id: guide-in-pmsma-001
  title: "India: Pradhan Mantri Surakshit Matritva Abhiyan (PMSMA) - Free Monthly Check-up"
  content: >
    Under PMSMA, run by India's Ministry of Health and Family Welfare, pregnant women can
    get a free antenatal check-up from a doctor (obstetrician, gynaecologist or physician) at
    government health facilities on the 9th of every month, for those in the second and
    third trimesters. It adds to routine antenatal visits and is meant to catch high-risk
    pregnancies early. Visit your nearest government health facility to confirm timings.
  domain: MODERN_MEDICAL
  subdomain: antenatal_schemes
  source_id: mohfw-pmsma
  source_type: government_scheme
  authority: Ministry of Health and Family Welfare, Government of India
  url: https://www.nhm.gov.in/index1.php?lang=1&level=2&sublinkid=822&lid=218
