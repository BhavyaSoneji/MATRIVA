- document_id: guide-nhs-morning-sickness-001
  title: "NHS: Morning Sickness - What Helps and When to Get Help"
  content: >
    Nausea and vomiting in early pregnancy is very common and usually clears up by weeks 16 to 20, without raising the baby's risk. NHS suggests resting, avoiding foods or smells that trigger it, eating dry toast or a plain biscuit in the morning, eating small frequent plain meals high in carbohydrate and low in fat, choosing cold foods if the smell of hot food is a problem, sipping fluids often, and trying ginger or wrist acupressure (there is some evidence for both; check with a pharmacist before taking ginger supplements). Contact a midwife or doctor if you cannot keep food or fluids down for 24 hours, have very dark urine or have not passed urine for 8 hours, feel faint, have tummy pain or a fever, vomit blood, or are losing weight, as this may be severe sickness (hyperemesis gravidarum) needing treatment.
  domain: MODERN_MEDICAL
  subdomain: symptoms
  source_id: nhs-morning-sickness
