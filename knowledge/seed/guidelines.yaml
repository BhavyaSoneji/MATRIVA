- document_id: guide-nhs-gdm-001
  title: "NHS: Gestational Diabetes - Testing and Diet"
  content: >
    Gestational diabetes is diabetes that develops in pregnancy and usually settles after the
    baby is born. Women at higher risk are offered an oral glucose tolerance test, usually
    between 24 and 28 weeks. Management centres on healthy eating, regular activity and
    monitoring blood glucose, with medication if needed; a dietitian or diabetes team
    guides the plan.
  domain: MODERN_MEDICAL
