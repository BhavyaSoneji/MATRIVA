- document_id: guide-who-activity-001
  title: "WHO: Physical Activity for Pregnant Women"
  content: >
    WHO's physical-activity guidelines advise that pregnant women without a medical or
    obstetric reason to avoid it should do regular physical activity, including at least 150
    minutes of moderate-intensity aerobic activity spread across the week, together with
    gentle strength and stretching work. Anyone with a complication, bleeding or other
    concern should check with their provider before starting or continuing exercise.
