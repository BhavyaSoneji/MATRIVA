- document_id: guide-nin-dos-donts-001
  title: "ICMR-NIN: Pregnancy Do's and Don'ts - Habits, Check-ups and Medicines"
  content: >
    ICMR-NIN advises pregnant women to avoid alcohol, smoking and tobacco chewing, to take medicines only when prescribed by a doctor, and to avoid excess coffee and tea because caffeine can affect the baby's growth. They should have regular check-ups for weight gain, blood pressure and anaemia, and receive tetanus toxoid immunisation. Enough physical exercise with 2-3 hours of rest during the day is recommended. ICMR-NIN says wrong food beliefs and taboos should be discouraged, and that preventing food-borne illness by avoiding contaminated food is an important protective measure. Iron, folate and calcium supplements are advised regularly after 14-16 weeks of pregnancy and continued during breastfeeding.
