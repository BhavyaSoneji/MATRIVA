- document_id: guide-nhs-preeclampsia-001
  title: "NHS: Warning Signs of Pre-eclampsia"
  content: >
    Pre-eclampsia is a pregnancy condition involving high blood pressure, usually after
    week 20. NHS lists severe headache, vision problems such as blurring or flashing, pain
    just below the ribs, vomiting, and sudden swelling of the face, hands or feet as signs
    that need urgent assessment. These symptoms should be reported to a midwife or doctor
    straight away rather than waited out, and regular blood-pressure and urine checks at
    antenatal visits are how it is usually found.
  domain: MODERN_MEDICAL
  subdomain: warning_signs
