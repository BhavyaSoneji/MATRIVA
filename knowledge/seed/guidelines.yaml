- document_id: guide-nhs-labour-signs-001
  title: "NHS: Signs That Labour Has Begun and When to Call"
  content: >
    Signs labour may be starting include contractions or tightenings, a 'show' (the mucus plug coming away), backache, an urge to go to the toilet, and the waters breaking. Practice (Braxton Hicks) tightenings are usually painless, short, infrequent and do not build up, whereas labour contractions become longer, stronger and more frequent. NHS advises calling the midwife or maternity unit if you think you are in labour or contractions come every 5 minutes or more often. Call urgently, even at night, if your waters break, you have vaginal bleeding, the baby is moving less than usual, you are less than 37 weeks, any contraction lasts over 2 minutes, or you have 6 or more contractions in 10 minutes. Call for an ambulance if you feel a strong urge to push.
