- document_id: guide-nhs-vitamins-001
  title: "NHS: Folic Acid and Vitamin D in Pregnancy"
  content: >
    NHS advice is to take 400 micrograms of folic acid daily from before conception until
    week 12 of pregnancy, to lower the risk of neural tube defects such as spina bifida, and
    to take 10 micrograms of vitamin D daily through pregnancy and breastfeeding. Women with
    diabetes, epilepsy, obesity or a previous affected pregnancy may be advised a higher
    folic acid dose by their doctor.
