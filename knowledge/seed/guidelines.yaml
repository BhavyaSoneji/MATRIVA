- document_id: guide-nhs-exercise-001
  title: "NHS: Exercise in Pregnancy"
  content: >
    NHS encourages staying active in pregnancy: gentle activities such as walking, swimming,
    prenatal yoga or pilates classes, and pelvic floor exercises every day. Avoid contact
    sports and activities with a high risk of falling, and avoid scuba diving. Stop and seek
    advice if you have pain, dizziness, vaginal bleeding or shortness of breath. You should
    be able to hold a conversation while exercising.
