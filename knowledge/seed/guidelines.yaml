- document_id: guide-who-anaemia-001
  title: "WHO: Anaemia in Pregnancy - Definition and Why It Matters"
  content: >
    WHO defines anaemia in pregnancy as a haemoglobin concentration below 11 g/dL. Anaemia is
    common in pregnancy, most often from iron deficiency, and is associated with fatigue and
    with higher risks for mother and baby. Iron-rich foods (legumes, leafy greens, jaggery,
    meat and fish where eaten) combined with vitamin C sources help absorption; supplements
    and treatment are decided by a provider after a blood test.
  domain: MODERN_MEDICAL
  subdomain: anaemia
