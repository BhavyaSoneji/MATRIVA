- document_id: guide-nhs-mental-health-001
  title: "NHS: Mental Health in Pregnancy"
  content: >
    Depression and anxiety can start or return during pregnancy. NHS advice is to eat a balanced diet, talk about feelings with someone you trust or a midwife or doctor, make time for something enjoyable, stay active, attend antenatal classes, and be honest with your care team about how you really feel. Talking therapies such as CBT often help, and medicine may be offered at the lowest effective dose if needed. If you already take prescribed medicine, do not stop it without speaking to your doctor. Speak to your doctor or maternity unit if you are worried about your mental health, and seek urgent help in a crisis.
