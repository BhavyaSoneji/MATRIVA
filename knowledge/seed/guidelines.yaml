- document_id: guide-nhs-vaccines-001
  title: "NHS: Vaccinations in Pregnancy"
  content: >
    NHS recommends the inactivated flu vaccine and the whooping cough vaccine in pregnancy (whooping cough ideally from 16 to 32 weeks, usually at 20 weeks, so antibodies pass to the baby), and an RSV vaccine from about 28 weeks. Tetanus vaccine is safe if needed. Live vaccines such as MMR are usually delayed until after the birth because of a theoretical risk to the baby, though no live vaccine has been shown to cause birth defects. Schedules differ between countries; in India the antenatal tetanus-diphtheria (Td) doses are given under the national programme, so ask your doctor or ANM which vaccines you need and when.
