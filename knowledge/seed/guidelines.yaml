- document_id: guide-who-caffeine-001
  title: "WHO: Limiting Caffeine in Pregnancy"
  content: >
    WHO recommends that pregnant women with a high daily caffeine intake, more than 300 mg a
    day, lower it to reduce the risk of pregnancy loss and low birth weight. Caffeine is
    found in coffee, tea, cola drinks, energy drinks and chocolate.
