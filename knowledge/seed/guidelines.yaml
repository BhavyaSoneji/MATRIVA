- document_id: guide-who-breastfeeding-001
  title: "WHO: Exclusive Breastfeeding for the First Six Months"
  content: >
    WHO recommends starting breastfeeding within the first hour after birth, exclusive
    breastfeeding for the first 6 months of life, and continued breastfeeding with
    appropriate complementary foods up to 2 years of age or beyond. Preparing in the third
    trimester - learning positioning and latch, and knowing where to get lactation support -
    helps many mothers.
  domain: MODERN_MEDICAL
  subdomain: postpartum
