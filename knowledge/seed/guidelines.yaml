- document_id: guide-nhs-food-safety-001
  title: "NHS: Foods to Avoid or Limit in Pregnancy"
  content: >
    NHS advice is to avoid alcohol; unpasteurised milk and products made from it; mould-ripened
    soft cheeses such as brie and camembert and soft blue cheeses unless cooked until steaming
    hot; raw or undercooked meat; liver and liver products, because of high vitamin A; and
    fish high in mercury such as shark, swordfish and marlin. Oily fish is encouraged but
    limited to two portions a week. Wash fruit, vegetables and salad well, and cook meat, eggs
    and ready meals thoroughly to reduce the risk of listeria, toxoplasma and salmonella.
  domain: MODERN_MEDICAL
  subdomain: food_safety
  source_id: nhs-foods-to-avoid
