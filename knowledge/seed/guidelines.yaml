- document_id: guide-in-pmmvy-001
  title: "India: Pradhan Mantri Matru Vandana Yojana (PMMVY) - Maternity Cash Benefit"
  content: >
    PMMVY is a Government of India maternity benefit scheme that gives eligible pregnant and
    lactating women a conditional cash transfer in instalments, linked to registering the
    pregnancy, attending antenatal check-ups and registering the birth and first
    immunisations. Eligibility rules and amounts have been revised over time, so check the
