- document_id: guide-nhs-back-pain-001
  title: "NHS: Back Pain in Pregnancy"
  content: >
    Back pain is common in pregnancy because ligaments soften and stretch, straining the lower back and pelvis. NHS suggests bending the knees and keeping the back straight when lifting, avoiding heavy lifting, not twisting the spine, wearing flat shoes, supporting the back when sitting, resting, a warm bath or massage, a supportive mattress and back-care classes. Paracetamol can be used unless a doctor or midwife says otherwise. In the second or third trimester, back pain can be a sign of early labour; contact a doctor or midwife urgently if it comes with fever, vaginal bleeding, pain when passing urine, or pain under the ribs. Loss of feeling in the legs, buttocks or genitals is an emergency.
