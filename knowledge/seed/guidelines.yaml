- document_id: guide-nhs-movements-001
  title: "NHS: Your Baby's Movements"
  content: >
    Most women first feel their baby move between about 16 and 24 weeks. There is no set
    number of movements to expect; what matters is knowing your baby's usual pattern. NHS
    advises contacting your midwife or maternity unit immediately if you notice your baby's
    movements slowing down or stopping - not waiting until the next day - and not using
    home dopplers or phone apps to check the baby is well.
