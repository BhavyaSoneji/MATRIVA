- document_id: guide-nhs-smoking-001
  title: "NHS: Stopping Smoking in Pregnancy"
  content: >
    NHS advises that smoking in pregnancy harms the baby by restricting oxygen supply, and that stopping reduces the risk of pregnancy and birth complications, stillbirth, premature birth, low birth weight and sudden infant death syndrome. It is never too late to quit, and stopping even in the last weeks helps. Secondhand smoke from a partner or household member also harms the baby. Nicotine replacement can be used in pregnancy if you cannot stop without it and is much better than smoking; stop-smoking tablets such as varenicline and bupropion are not recommended in pregnancy.
