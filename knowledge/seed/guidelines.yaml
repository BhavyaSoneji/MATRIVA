- document_id: guide-who-calcium-001
  title: "WHO: Calcium Supplementation to Reduce Pre-eclampsia Risk"
  content: >
    WHO recommends calcium supplementation (1.5-2.0 g of elemental calcium per day) for
    pregnant women in populations where dietary calcium intake is low, to reduce the risk of
    pre-eclampsia. Calcium supplements are not a substitute for a calcium-containing diet
    such as milk, curd, ragi and leafy greens, and should be started on a provider's advice.
  domain: MODERN_MEDICAL
  subdomain: supplements
  source_id: who-antenatal-2016
