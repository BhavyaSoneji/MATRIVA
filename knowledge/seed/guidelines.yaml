- document_id: guide-nin-balanced-plate-001
  title: "ICMR-NIN: What to Eat in Pregnancy - a Balanced Indian Plate"
  content: >
    ICMR-NIN advises a pregnant woman to eat a wide variety of foods every day so that both her own needs and her baby's are met. About 60% of her energy can come from rice, wheat and millets, and cooking oil adds energy and essential fats. Good-quality protein comes from milk, fish, meat, poultry and eggs, and a combination of cereals, pulses and nuts also gives adequate protein for vegetarians. Seasonal vegetables, especially green leafy vegetables, milk and fresh fruits supply the vitamins and minerals. Milk is the best source of well-absorbed calcium. Sprouted and fermented grams, and foods rich in vitamin C such as citrus fruits, improve iron absorption. Choose fibre-rich foods such as whole grains, pulses and vegetables to avoid constipation, and drink plenty of fluids, around 8-12 glasses of water a day.
  domain: MODERN_MEDICAL
  subdomain: diet
  source_id: nin-dietary-guidelines
  source_type: government_guideline
