# SECOND held-out set, written BEFORE the changes made in response to heldout.yaml's results, so it measures those
# changes on questions the engine (and its author) had not seen. Same rules as heldout.yaml.

in_scope:
  - {q: "What should I do if my baby kicks less than before?", expect_docs: [guide-nhs-movements-001]}
  - {q: "Which exercises are good for a pregnant woman?", expect_docs: [guide-nhs-exercise-001, guide-who-activity-001]}
  - {q: "Why is folic acid important for my baby's spine?", expect_docs: [guide-nhs-vitamins-001, guide-nin-folic-001]}
  - {q: "How often should I see a doctor during pregnancy?", expect_docs: [seed-anc-fogsi-001, guide-in-pmsma-001]}
  - {q: "When should I stop worrying about vomiting and call someone?", expect_docs: [guide-nhs-morning-sickness-001]}
  - {q: "Does drinking milk help my baby's bones?", expect_docs: [guide-nin-balanced-plate-001, guide-who-calcium-001, seed-ifct-ragi-001, guide-nhs-healthy-diet-001]}
  - {q: "What are good vegetarian sources of protein for pregnant women?", expect_docs: [guide-nin-balanced-plate-001, guide-nhs-healthy-diet-001, food-usda-172421, food-usda-174257, seed-ifct-moong-dal-001]}
  - {q: "Should I be worried about high sugar levels during pregnancy?", expect_docs: [guide-nhs-gdm-001]}
  - {q: "What are the signs of an approaching delivery?", expect_docs: [guide-nhs-labour-signs-001]}
  - {q: "Can my back hurt because of pregnancy?", expect_docs: [guide-nhs-back-pain-001]}
  - {q: "How much calcium does ragi contain?", expect_docs: [seed-ifct-ragi-001, food-usda-168871]}
  - {q: "What is the recommended duration of breastfeeding?", expect_docs: [guide-who-breastfeeding-001]}
  - {q: "Is it bad to feel depressed or anxious while expecting?", expect_docs: [guide-nhs-mental-health-001]}
  - {q: "What does the classical text say about the first month of pregnancy?", expect_text: [first month]}
  - {q: "What is pumsavana?", expect_text: [pumsawana, pumsavana, punsavana]}
  - {q: "What do the old texts say about taking milk during pregnancy?", expect_text: [milk]}

out_of_scope:
  - "What is the capital of Japan?"
  - "Suggest a good movie for the weekend"
  - "How do I bake sourdough bread?"
  - "What are the symptoms of diabetes in children?"
  - "How do I fix a leaking tap?"
  - "Which baby stroller is the best?"
