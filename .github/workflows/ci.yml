name: CI

on:
  pull_request:
  push:
    branches: [main, backend/bhavya, frontend/raj, mvp]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # requirements-dev.txt pins ruff and mypy, so CI and a laptop report the same findings.
      - run: pip install -r requirements-dev.txt
      # Each step runs even if an earlier one failed, so one problem cannot hide the others.
      - run: ruff check .
        if: always()
      - run: python scripts/secret_scan.py --root ..
        if: always()
      # Issue #97: CI audited only npm, so vulnerable Python pins went unnoticed.
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --progress-spinner off
        if: always()
      - run: mypy app/
        if: always()
      - run: pytest
        if: always()

  ingestion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install -r ../backend/requirements.txt
      - run: pytest tests/

  evaluation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install -r ../backend/requirements.txt
      - run: pytest tests/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
