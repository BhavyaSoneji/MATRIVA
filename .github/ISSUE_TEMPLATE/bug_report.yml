name: Bug report
description: Something is broken or behaving unexpectedly
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [backend, frontend, ingestion, evaluation, database, rag/ai, safety, ci/docs]
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact error message if there is one.
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations: {required: true}
  - type: textarea
    id: env
    attributes:
      label: Environment / logs
      description: Branch or commit, OS, browser, relevant logs or screenshots.
