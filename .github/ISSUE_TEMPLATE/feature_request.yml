name: Feature request
description: Propose a new feature or improvement
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [backend, frontend, ingestion, evaluation, database, rag/ai, safety, ci/docs]
    validations: {required: true}
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
    validations: {required: true}
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations: {required: true}
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ...\n- [ ] ..."
