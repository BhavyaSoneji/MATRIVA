# Exposures and activities, one rule each.
groups:
  - {"cls": "avoid_substance", "src": ["nhs-pregnancy", "acog", "cdc-pregnancy"], "items": [
      {"name": "cat litter", "aka": ["cat poop", "cat faeces", "cat feces", "changing cat litter", "cleaning cat litter", "kitty litter", "cat litter box", "cat droppings", "stray cat poop"], "why": "cat faeces can carry toxoplasma, which can harm the baby; ask someone else to change the litter, or wear gloves and wash your hands well"},
      {"name": "gardening soil", "aka": ["gardening", "garden soil", "handling soil", "digging soil", "potting soil", "compost", "composting", "farm work", "farming", "working in the field", "field work", "kheti", "kheti ka kaam", "खेती", "ખેતી"], "why": "soil can carry toxoplasma and other germs; wear gloves, wash your hands, and wash any home-grown produce well"},
      {"name": "lambing", "aka": ["newborn lambs", "sheep lambing", "farm animals birth", "calving", "cow delivery", "buffalo delivery", "goat kidding", "animal delivery", "birthing animals", "helping animal birth", "animal birth fluids", "afterbirth animal", "placenta animal", "handling newborn animals", "helping a cow give birth", "helping a buffalo give birth", "helping a goat give birth"], "why": "animals giving birth can pass on infections such as chlamydia, listeria, Q fever and toxoplasma that can cause miscarriage; avoid contact with birthing animals"},
      {"name": "animal bite", "aka": ["dog bite", "cat bite", "cat scratch", "monkey bite", "stray dog bite", "rabies", "bitten by a dog", "bitten by a cat", "bitten by a monkey", "bitten by an animal", "dog scratch", "licked by a dog", "dog licked wound", "bat bite", "rat bite", "snake bite", "snakebite", "scorpion sting", "bee sting", "wasp sting", "insect bite", "spider bite", "bitten by a snake", "stung by a scorpion", "कुत्ते ने काटा", "કૂતરું કરડ્યું"], "why": "an animal bite can mean rabies, tetanus or infection, and rabies treatment is not withheld in pregnancy; see a doctor straight away"},
      {"name": "pesticides", "aka": ["pesticide", "insecticide", "weedicide", "herbicide", "fumigation", "pest control", "termite treatment", "cockroach spray", "baygon", "hit spray", "all out", "good knight", "odomos", "mosquito coil", "mosquito coils", "mosquito repellent liquid", "mosquito spray", "pesticide spraying", "crop spraying", "spraying pesticide", "organophosphate", "pesticide residue", "farm chemicals", "naphthalene balls", "naphthalene", "moth balls", "mothballs"], "why": "some pesticides and household chemical sprays have been linked to miscarriage and developmental harm; avoid spraying, ventilate rooms, and let someone else do it"},
      {"name": "paint fumes", "aka": ["fresh paint", "painting the house", "painting the room", "paint thinner", "thinner", "turpentine", "solvent", "solvents", "benzene", "formaldehyde", "nail polish remover", "acetone", "enamel paint", "oil paint fumes", "spray paint", "glue fumes", "adhesive fumes", "fevicol", "chemical fumes", "toxic fumes", "industrial fumes", "factory fumes", "dye fumes", "working with chemicals", "chemicals at work", "chemical exposure", "paint remover"], "why": "paint, solvent and chemical fumes can harm a developing baby in large or repeated amounts; avoid painting and chemicals, and ventilate well"},
      {"name": "lead exposure", "aka": ["lead paint", "kajal", "surma", "lead surma", "lead in water", "old pipes lead", "lead pipe", "glazed pottery", "ceramic glaze", "lead glaze", "lead battery", "battery recycling", "lead-acid battery", "lead smelting", "painting old house", "lead in spices", "lead in haldi", "turmeric lead", "adulterated turmeric", "lead chromate"], "why": "lead can cross the placenta and harm the baby's brain; kajal, surma, some traditional powders, old paint and glazed pottery can contain it"},
      {"name": "mercury", "aka": ["mercury thermometer", "broken thermometer", "mercury spill", "mercury vapour", "mercury in fish", "skin lightening cream mercury", "fairness cream mercury", "mercury amalgam", "dental amalgam removal", "amalgam filling", "mercury in cosmetics", "mercury cream", "mercurial cream", "mercury poisoning", "gold mining mercury", "artisanal mining", "mercury lamp", "cfl bulb broken", "broken cfl", "tube light broken", "fluorescent tube broken"], "why": "mercury harms a developing brain; clean up spills carefully, avoid skin-lightening creams that contain it, and avoid high-mercury fish"},
      {"name": "x-ray", "aka": ["xray", "x ray", "ct scan", "radiation", "radioactive", "radiotherapy", "nuclear medicine", "radioiodine", "radio iodine", "thyroid scan", "bone scan", "pet scan", "ct angiography", "dental x-ray", "dental xray", "chest x-ray", "chest xray", "abdominal x-ray", "pelvic x-ray", "fluoroscopy", "barium", "barium meal", "barium swallow", "contrast dye", "mri contrast", "gadolinium", "mammogram", "mammography", "dexa scan", "bone density scan", "angiography", "angiogram", "cardiac cath", "radiograph", "radiology"], "why": "radiation can harm a developing baby, mostly at high doses; tell your doctor, dentist and radiographer you are pregnant before any X-ray or scan, and do not refuse one that is truly needed"},
      {"name": "smoke from cooking fuel", "aka": ["chulha", "chulha smoke", "wood stove", "wood fire cooking", "cow dung cakes", "uple", "cooking on wood", "cooking on coal", "biomass fuel", "biomass smoke", "indoor air pollution", "firewood", "dung cake fuel", "charcoal stove", "coal stove", "चूल्हा", "ચૂલો", "ધુમાડો"], "why": "smoke from wood, dung and coal cooking fires is linked to low birth weight and stillbirth; cooking on LPG or an improved stove and keeping the kitchen ventilated helps"},
      {"name": "second-hand smoke", "aka": ["passive smoking", "secondhand smoke", "second hand smoke", "husband smokes", "smoking at home", "family smokes", "smoke in the house", "hookah smoke", "beedi smoke", "cigarette smoke", "smoky room", "bidi smoke", "sutta smoke"], "why": "breathing in other people's smoke raises the risk of low birth weight and stillbirth; ask people not to smoke around you and avoid smoky places"},
      {"name": "incense and dhoop smoke", "aka": ["dhoop", "agarbatti", "incense", "incense sticks", "incense smoke", "sambrani", "loban", "havan", "havan smoke", "hawan", "हवन", "ધૂપ"], "why": "smoke from incense and havan in a closed room adds to indoor air pollution and can irritate your lungs; keep the room ventilated and limit how long you stay in the smoke"},
      {"name": "air pollution", "aka": ["smog", "high aqi", "bad air quality", "polluted air", "air quality index", "aqi", "delhi pollution", "pollution mask", "n95 mask", "stubble burning", "crop burning smoke", "diwali smoke", "firecracker smoke", "crackers smoke", "burning garbage smoke", "pm2.5", "pm 2.5"], "why": "high air pollution is linked to low birth weight and early birth; on bad-air days limit time outdoors, avoid busy roads, and keep indoor air clean"},
      {"name": "hot tub", "aka": ["jacuzzi", "sauna", "steam room", "steam bath", "very hot bath", "hot water bath", "hot bath", "hot springs", "heated pool", "bikram", "sauna suit", "infrared sauna", "hammam", "turkish bath", "whirlpool", "spa bath", "hot spa", "hot yoga room"], "why": "a body temperature above about 39 degrees C in early pregnancy is linked to neural tube defects; keep baths warm rather than hot, and avoid saunas and hot tubs"},
      {"name": "heating pad on belly", "aka": ["heat pad", "hot water bottle on belly", "heating pad", "electric blanket", "hot compress on belly", "hot pack on stomach", "hot water bag on stomach", "sekai", "garam pani ki thaili", "gram sek", "bag of hot water on stomach"], "why": "direct heat on the belly can raise the baby's temperature; use a warm, not hot, compress on your back instead and ask your doctor"},
      {"name": "contact sports", "aka": ["horse riding", "skiing", "snowboarding", "scuba diving", "diving", "skydiving", "parachuting", "bungee jumping", "roller coaster", "amusement rides", "theme park rides", "rock climbing", "kabaddi", "kho kho", "football", "cricket", "hockey", "basketball", "volleyball", "boxing", "martial arts", "karate", "judo", "taekwondo", "wrestling", "kushti", "rafting", "white water rafting", "mountain biking", "high altitude trek", "paragliding", "go karting", "go-karting", "quad biking", "dirt biking", "motocross", "trampoline", "trampolining"], "why": "sports and rides with a risk of falls, blows to the belly, sudden jolts or low oxygen (scuba, altitude) are advised against in pregnancy; gentle activity such as walking and swimming is the usual advice"},
      {"name": "lifting heavy loads", "aka": ["heavy lifting", "lifting weights", "carrying heavy bags", "carrying water pots", "carrying matka", "carrying heavy water", "head load", "head loads", "carrying bricks", "construction work", "carrying firewood", "carrying fodder", "carrying gas cylinder", "lifting gas cylinder", "carrying heavy luggage", "bhaari saman uthana", "wazan uthana", "pani ki matki", "matka uthana", "bojh uthana", "bhari bojh", "भारी सामान", "वज़न उठाना", "ભારે વજન", "બોજ"], "why": "heavy lifting and straining can cause back strain and, in some pregnancies, bleeding or early labour; ask your doctor what is safe for you, and share the load"},
      {"name": "long standing or night shifts", "aka": ["long standing", "standing for long", "standing all day", "night shift", "night shifts", "working long hours", "shift work"], "why": "very long hours, long standing and night shifts are linked to a higher chance of early birth and low birth weight in some studies; ask your doctor and employer about adjusting work, and rest when you can"},
      {"name": "travel", "aka": ["flight", "flying", "air travel", "long journey", "long drive", "road trip", "train journey", "bus journey", "bumpy road", "travelling", "traveling", "pilgrimage", "yatra", "hajj", "umrah", "motorbike ride", "scooter ride", "two wheeler ride", "two-wheeler", "riding pillion", "high altitude", "hill station", "going to maika", "travel to maika", "journey to hometown"], "why": "travel is usually possible in a healthy pregnancy, but long journeys, bumpy roads, two-wheelers, high altitude and flying late in pregnancy carry extra risks; airlines often restrict flying late in pregnancy, so check with your doctor before you go"}
    ]}
