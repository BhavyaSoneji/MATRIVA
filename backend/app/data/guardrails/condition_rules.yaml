# Rules that apply because of what the person told us about themselves (conditions, risk factors, week, age,
# medicines, allergies). `when` is the profile test; `terms` is the topic that must also be in the question.
# A rule with no terms is a standing reminder shown once at the start of a chat (see watch.yaml).
rules:
  # ---- High blood pressure and pre-eclampsia ----
  - {id: cond-htn-salt, when: {conditions: [hypertension, preeclampsia]}, action: caution, title: Salt and high blood pressure, terms: [salt, namak, pickle, pickles, achar, papad, "processed food", "packaged food", chips, namkeen, "instant noodles", maggi, "soy sauce", ajinomoto, msg, "पापड़", "अचार", "नमक", "મીઠું", "અથાણું", "પાપડ"], message: "You have told me you have high blood pressure. Your doctor or dietitian may advise limiting salt, pickles, papad and packaged food. Please follow their advice and don't skip your blood pressure tablets.", src: [nice-hypertension, icmr-nin]}
  - {id: cond-htn-exercise, when: {conditions: [hypertension, preeclampsia]}, action: caution, title: Exercise with high blood pressure, terms: [exercise, workout, gym, yoga, running, jogging, cycling, swimming, aerobics, zumba, "weight training", lifting, "heavy lifting", "brisk walk", walking], message: "You have told me you have high blood pressure. Ask your doctor what activity is right for you. Stop and call your doctor if you get a headache, blurred vision, chest pain, shortness of breath or swelling.", src: [nhs-exercise, acog, nice-hypertension]}
  - {id: cond-htn-bp-tablet, when: {conditions: [hypertension, preeclampsia]}, action: caution, title: Blood pressure medicine, terms: ["bp tablet", "bp medicine", "bp medication", "blood pressure tablet", "blood pressure medicine", "blood pressure medication", "bp pill", "bp pills", "bp goli", "bp ki goli", "bp ki dawai", "बीपी की गोली", "बीपी की दवा", "બીપીની ગોળી", "બીપીની દવા"], message: "Untreated high blood pressure in pregnancy is dangerous. Don't stop, skip or change your blood pressure medicine yourself, and ask your doctor if it is still the right one in pregnancy; some blood pressure medicines are not safe for the baby.", src: [nice-hypertension, nhs-preeclampsia]}
  - {id: cond-htn-home-bp, when: {conditions: [hypertension, preeclampsia]}, action: caution, title: Home blood pressure readings, terms: ["bp reading", "bp readings", "bp is high", "bp high", "high bp reading", "140/90", "150/100", "160/110", "bp machine", "bp monitor", "check my bp", "checking my bp", "measure my bp", "bp check", "blood pressure reading", "blood pressure readings", "blood pressure is high", "blood pressure high"], message: "A blood pressure of 140/90 or more in pregnancy needs a doctor's assessment; 160/110 or more, or any high reading with a headache, vision changes or upper-abdominal pain, is an emergency.", src: [nice-hypertension, nhs-preeclampsia, who-anc]}
  # ---- Diabetes ----
  - {id: cond-diab-food, when: {conditions: [gestational_diabetes, diabetes]}, action: caution, title: Sugar and diabetes, terms: [sweets, sweet, mithai, sugar, jaggery, gud, honey, "fruit juice", juice, sugarcane, "ganne ka ras", dates, mango, banana, grapes, rice, "white rice", maida, "white bread", biscuits, cake, ice cream, "ice-cream", chocolate, jalebi, "gulab jamun", ladoo, laddu, halwa, kheer, "cold drink", "cold drinks", "soft drink", soda, "मिठाई", "चीनी", "गुड़", "आम", "चावल", "મીઠાઈ", "ખાંડ", "ગોળ", "કેરી", "ચોખા"], message: "You have told me you have diabetes or gestational diabetes. Your doctor or dietitian will give you a meal plan and blood-sugar targets. Sweets, juices and refined carbohydrates raise blood sugar quickly, so please check what is right for you and keep to your plan.", src: [nhs-gdm, acog, icmr-nin]}
  - {id: cond-diab-fasting, when: {conditions: [gestational_diabetes, diabetes]}, action: block, title: Fasting with diabetes, terms: [fasting, fast, vrat, upvas, upavas, roza, ramzan, ramadan, navratri, karwa, karva, ekadashi, nirjala, "skip meals", "skipping meals", "long gap between meals", "व्रत", "उपवास", "रोज़ा", "રોજા", "ઉપવાસ", "વ્રત"], unless: ["fasting blood sugar", "fasting sugar", "fasting glucose", "fasting test", "fasting blood glucose", "fasting level", "fasting levels", "fasting reading", "fasting readings", "fasting plasma", "fasting insulin"], message: "You have told me you have diabetes. Fasting or long gaps between meals can drop your blood sugar dangerously, especially if you take insulin or tablets. Please speak to your doctor before any fast; they can tell you whether it is safe and how to manage your medicine.", src: [nhs-gdm, acog]}
  - {id: cond-diab-low-sugar, when: {conditions: [gestational_diabetes, diabetes]}, action: block, title: Signs of low blood sugar, terms: [shaky, shaking, trembling, "sweating a lot", "cold sweat", "cold sweats", "sweaty and shaky", hungry all the time, confused, confusion, "heart racing", "blurred vision and sweating", "hypoglycemia", "hypoglycaemia", "low sugar", "low blood sugar", "sugar low", "sugar is low", "sugar dropped", "sugar level dropped", "sugar kam", "sugar low ho", "sugar down", "कांप", "पसीना", "शुगर कम", "ધ્રુજારી", "પરસેવો", "સુગર ઓછી"], message: "You have told me you have diabetes. Shakiness, sweating or confusion can be low blood sugar, which can become an emergency. Treat it the way your diabetes team taught you, recheck your sugar, and then call your doctor the same day. If you are confused or drowsy, call 112.", src: [nhs-gdm, acog]}
  - {id: cond-diab-readings, when: {conditions: [gestational_diabetes, diabetes]}, action: caution, title: Blood sugar numbers, terms: ["sugar level", "sugar levels", "sugar reading", "sugar readings", "blood sugar level", "blood sugar levels", "blood sugar reading", "blood sugar readings", "sugar is high", "sugar high", "high sugar", "high blood sugar", "sugar badh", "sugar zyada", "sugar high ho", "ogtt", "gtt", "glucose tolerance", "hba1c", "post meal sugar", "pp sugar", "fasting sugar", "fasting blood sugar", "random sugar", "शुगर बढ़", "शुगर ज़्यादा", "શુગર વધી", "સુગર વધારે"], message: "You have told me you have diabetes. Your doctor sets your own blood-sugar targets and the treatment to reach them; please share your readings with them rather than judging them alone.", src: [nhs-gdm, acog]}
  # ---- Thyroid ----
  - {id: cond-thyroid-iron-calcium, when: {conditions: [thyroid]}, action: caution, title: Thyroid tablet with iron or calcium, terms: [iron, ifa, calcium, "iron tablet", "calcium tablet", "prenatal vitamin", "prenatal vitamins", multivitamin, "antacid", "आयरन", "कैल्शियम", "આયર્ન", "કેલ્શિયમ"], message: "You have told me you have a thyroid condition. Iron, calcium and antacids can stop thyroid tablets from being absorbed, so doctors usually advise taking them several hours apart. Please ask your doctor or pharmacist how to space yours, and don't stop either.", src: [acog, who-anc]}
  - {id: cond-thyroid-tests, when: {conditions: [thyroid]}, action: caution, title: Thyroid tests in pregnancy, terms: [tsh, "thyroid test", "thyroid level", "thyroid levels", "thyroid report", "thyroid dose", "t3", "t4", "ft4", "ft3", "थायरॉइड टेस्ट", "થાઇરોઇડ ટેસ્ટ"], message: "You have told me you have a thyroid condition. Thyroid needs often change in pregnancy, and your doctor will check your levels and adjust your tablet. Don't change the dose yourself.", src: [acog, who-anc]}
  # ---- Epilepsy ----
  - {id: cond-epilepsy-folic, when: {conditions: [epilepsy]}, action: caution, title: Folic acid with epilepsy, terms: ["folic acid", folate, folvite, "5 mg", "4 mg", "high dose folic", "आयरन फोलिक", "फोलिक एसिड", "ફોલિક એસિડ"], message: "You have told me you have epilepsy. Women who take seizure medicines are often advised a higher folic acid dose than usual. Ask your neurologist or obstetrician what is right for you.", src: [acog, nice-hypertension]}
  - {id: cond-epilepsy-triggers, when: {conditions: [epilepsy]}, action: caution, title: Seizure triggers, terms: [sleep, "lack of sleep", "not sleeping", insomnia, "sleepless", bath, bathing, swimming, "swim", cooking, "cooking on gas", "gas stove", "climbing", stairs, driving, "scooter", "bike", "riding", alone, "stress", "flashing lights", "fasting", "skipping meals", "alcohol"], message: "You have told me you have epilepsy. Lack of sleep, missed medicine, skipped meals, stress and illness make seizures more likely; take sensible precautions (for example, don't bathe or swim alone) and tell your neurologist about any seizure straight away.", src: [acog, nhs-pregnancy]}
  # ---- Asthma ----
  - {id: cond-asthma-inhaler, when: {conditions: [asthma]}, action: caution, title: Asthma inhaler, terms: [inhaler, inhalers, puffer, "asthma pump", "asthma tablet", "asthma medicine", "asthma attack", wheezing, wheeze, "salbutamol", "budesonide", "formoterol", "seroflo", "foracort", "asthalin", "levolin", "इन्हेलर", "ઇન્હેલર"], message: "You have told me you have asthma. Uncontrolled asthma is more risky for the baby than the usual asthma inhalers, so please don't stop your inhaler without speaking to your doctor, and tell them if you are wheezing or using your reliever more often.", src: [acog, nhs-pregnancy]}
  # ---- Anaemia ----
  - {id: cond-anaemia-tea, when: {conditions: [anaemia]}, action: caution, title: Tea, coffee and iron, terms: [tea, chai, coffee, milk, "calcium tablet", "calcium", "iron tablet", "iron tablets", ifa, "ifa tablet", "iron absorption", "आयरन", "चाय", "કોફી", "ચા", "આયર્ન"], message: "You have told me you have anaemia. Tea, coffee, milk and calcium tablets can reduce how much iron you absorb, so it helps to take your iron tablet at a different time, ideally with something rich in vitamin C such as a lemon drink or an amla or guava. Ask your ANM or doctor what suits you.", src: [who-anc, icmr-nin, nhm]}
  - {id: cond-anaemia-symptoms, when: {conditions: [anaemia]}, action: block, title: Severe anaemia symptoms, terms: ["breathless", "breathlessness", "palpitations", "heart racing", "chest pain", "very weak", "very pale", "fainting", "faint", "swelling all over", "सांस फूल", "साँस फूल", "धड़कन तेज", "શ્વાસ ફૂલે", "ધબકારા વધી"], message: "You have told me you have anaemia. Breathlessness, a racing heart, fainting or looking very pale can mean your haemoglobin is dangerously low. You may need an urgent blood test and possibly iron injections or a transfusion.", src: [who-anc, acog]}
  # ---- Heart disease ----
  - {id: cond-heart-breathless, when: {conditions: [heart_disease]}, action: escalate, title: Heart condition and breathlessness, terms: [breathless, breathlessness, "short of breath", "shortness of breath", "cant breathe lying", "cant lie flat", "cannot lie flat", "palpitations", "chest tightness", "swelling in legs", "swollen legs", "sudden swelling", "cough at night", "pink frothy", "सांस फूल", "साँस फूल", "सांस लेने में", "धड़कन", "શ્વાસ ફૂલે", "શ્વાસ લેવામાં", "ધબકારા"], use: emergency, message: "You have told me you have a heart condition. Breathlessness, palpitations or new swelling can mean your heart is struggling in pregnancy.", src: [acog, nhs-pregnancy, who-anc]}
  - {id: cond-heart-exercise, when: {conditions: [heart_disease]}, action: block, title: Exercise with heart disease, terms: [exercise, workout, gym, yoga, running, jogging, cycling, swimming, aerobics, lifting, "heavy lifting", "stairs", "climbing"], message: "You have told me you have a heart condition. What activity is safe depends on your exact condition, so please ask your cardiologist and obstetrician before you exercise or lift anything heavy.", src: [acog, nhs-exercise]}
  # ---- Kidney, liver ----
  - {id: cond-kidney-supplement, when: {conditions: [kidney_disease]}, action: caution, title: Kidney disease and supplements, terms: [supplement, supplements, "protein powder", "protein shake", "high protein", "herbal", "ayurvedic", "painkiller", "painkillers", "nsaid", "potassium", "coconut water", "banana", "salt substitute", "creatine", "सप्लीमेंट", "સપ્લિમેન્ટ"], message: "You have told me you have kidney disease. Supplements, protein powders, herbal products, painkillers and potassium-rich foods can strain your kidneys, so please check each one with your kidney doctor and obstetrician first.", src: [acog, nice-hypertension]}
  - {id: cond-liver-meds, when: {conditions: [liver_disease, hepatitis_b, hepatitis_c]}, action: caution, title: Liver disease and medicines, terms: [paracetamol, crocin, dolo, herbal, ayurvedic, "supplement", "turmeric tablet", "painkiller", "antibiotic", "टैबलेट", "ગોળી"], message: "You have told me you have a liver condition. Many medicines and herbal products are processed by the liver, so please do not take any without your doctor knowing about your liver condition.", src: [acog, nhs-medicines]}
  - {id: cond-hepb-baby, when: {conditions: [hepatitis_b]}, action: caution, title: Hepatitis B and the newborn, terms: [baby, newborn, delivery, birth, vaccine, vaccination, breastfeeding, breastfeed, "hepatitis b vaccine", "hbig", "bacha", "baccha", "बच्चा", "डिलीवरी", "બાળક", "ડિલિવરી"], message: "You have told me you have hepatitis B. Tell the delivery team early: your baby needs the hepatitis B vaccine, and sometimes immunoglobulin, within hours of birth to be protected. Your doctor will plan this with you.", src: [who-anc, acog]}
  - {id: cond-hiv-art, when: {conditions: [hiv]}, action: caution, title: HIV, treatment and the newborn, terms: [baby, newborn, delivery, birth, breastfeeding, breastfeed, "art", "tablet", "tablets", "medicine", "medicines", "viral load", "cd4", "bacha", "baccha", "बच्चा", "डिलीवरी", "બાળક", "ડિલિવરી"], message: "You have told me you are HIV positive. Taking your ART every day, exactly as prescribed, makes it very unlikely your baby will get HIV. Please do not stop or skip it, and plan your delivery and your baby's preventive medicine with your ART centre.", src: [who-anc, mohfw]}
  - {id: cond-tb-symptoms, when: {conditions: [tuberculosis]}, action: block, title: Tuberculosis in pregnancy, terms: [cough, "night sweats", "weight loss", "blood in sputum", "coughing blood", "fever", "tb tablets", "tb medicine", "atT", "dots", "खांसी", "ખાંસી"], message: "You have told me you have, or have had, tuberculosis. TB treatment in pregnancy is safe and important, and must be taken for the full course. Please talk to your TB doctor and obstetrician before changing anything, and tell them about any cough, fever or weight loss.", src: [mohfw, who-anc]}
  # ---- Placenta and cervix ----
  - {id: cond-previa-activity, when: {conditions: [placenta_previa]}, action: block, title: Placenta praevia and activity, terms: [exercise, workout, gym, yoga, running, jogging, cycling, lifting, "heavy lifting", sex, intercourse, "sexual", travel, journey, "long journey", "bike", "scooter", "two wheeler", "bumpy", "stairs", "climbing", "सेक्स", "संभोग", "સેક્સ", "સંભોગ"], message: "You have told me you have a low-lying placenta (placenta praevia). Strenuous activity, heavy lifting, sex and long or bumpy journeys can trigger bleeding, so please do only what your doctor has said is safe. Any bleeding is an emergency: call 112.", src: [acog, rcog, nhs-bleeding]}
  - {id: cond-cervix-activity, when: {conditions: [cervical_insufficiency]}, action: block, title: Weak cervix and activity, terms: [exercise, workout, gym, yoga, running, jogging, cycling, lifting, "heavy lifting", sex, intercourse, "standing for long", "long standing", "stairs", "climbing", "travel", "journey", "bike", "scooter"], message: "You have told me you have a weak (incompetent) cervix or a cerclage. Lifting, strenuous activity, and sometimes sex or long standing are often restricted; please do only what your doctor has advised. Report any pressure, watery discharge or tightening straight away.", src: [acog, rcog]}
  # ---- Twins ----
  - {id: cond-twins-travel, when: {conditions: [twins], risk_factors: [twins]}, action: caution, title: Twin pregnancy and travel or exercise, terms: [travel, flight, flying, journey, exercise, workout, gym, yoga, lifting, "bike", "scooter"], message: "You have told me you are expecting twins or more. Twin pregnancies carry a higher chance of early labour and need closer care, so ask your doctor before travelling or exercising, and learn the signs of labour well before 37 weeks.", src: [nhs-pregnancy, rcog, acog]}
  # ---- Previous caesarean, preterm birth, miscarriage, stillbirth ----
  - {id: cond-prev-cs-scar, when: {conditions: [prev_cesarean], risk_factors: [previous_cesarean]}, action: block, title: Scar pain after a previous caesarean, terms: ["scar pain", "pain in my scar", "pain at the scar", "scar hurts", "scar is painful", "pain over my scar", "pain in the scar", "scar tenderness", "scar is tender", "tearing feeling", "something tore", "feel something tear", "scar opened", "scar open", "scar has opened", "scar bursting", "operation ke nishan mein dard", "ऑपरेशन के निशान में दर्द", "સ્કાર", "ઓપરેશનના નિશાનમાં દુખાવો"], message: "You have told me you had a previous caesarean. Pain at the scar, a tearing feeling, bleeding or the baby moving less can be a sign that the scar is giving way (uterine rupture), which is an emergency.", use: emergency, src: [acog, rcog]}
  - {id: cond-prev-cs-labour, when: {conditions: [prev_cesarean], risk_factors: [previous_cesarean]}, action: caution, title: Labour after a caesarean, terms: [vbac, "normal delivery", "normal birth", "labour at home", "home birth", "natural birth", "trial of labour", "trial of labor", "induce", "induction", "labour", "labor", "contractions", "contraction", "प्रसव", "નોર્મલ ડિલિવરી", "નોર્મલ"], message: "You have told me you had a previous caesarean. The safest plan for labour depends on your scar and your history, and should be made with your obstetrician in advance. Plan to deliver in a hospital, and go in as soon as labour starts.", src: [acog, rcog]}
  - {id: cond-prev-preterm, when: {conditions: [prev_preterm], risk_factors: [previous_preterm_birth]}, action: block, title: Warning signs after a previous early birth, terms: ["backache", "back pain", "lower back ache", "pelvic pressure", "pressure down below", "cramps", "cramping", "tightening", "tightenings", "contractions", "contraction", "period like pain", "period pain", "watery discharge", "discharge", "spotting", "बैकपेन", "कमर दर्द", "कमर में दर्द", "કમરનો દુખાવો", "કમરમાં દુખાવો"], message: "You have told me you had a previous early birth. A new backache, cramps, pelvic pressure or discharge can be early signs of preterm labour for you, so please call your doctor or maternity unit today rather than waiting.", src: [acog, rcog]}
  - {id: cond-prev-miscarriage, when: {conditions: [prev_miscarriage], risk_factors: [previous_miscarriage]}, action: block, title: Bleeding or cramps after previous miscarriage, terms: [cramps, cramping, spotting, bleeding, "brown discharge", "pink discharge", "abdominal pain", "stomach pain", "belly pain", "lower abdominal pain", "period like", "बैकपेन", "ब्लीडिंग", "ખેંચાણ", "સ્પોટિંગ"], message: "You have told me you have had a miscarriage before. Cramps, spotting or bleeding need a check today, with a scan and blood tests if your doctor advises.", src: [nhs-miscarriage, rcog, acog]}
  - {id: cond-prev-stillbirth, when: {risk_factors: [previous_stillbirth]}, action: escalate, title: Movements after a previous stillbirth, terms: ["less movement", "reduced movement", "reduced movements", "fewer kicks", "less kicks", "baby is quiet", "baby quiet", "not moving", "no movement", "hasnt moved", "hasn't moved", "stopped moving", "slow movements", "baby moving less", "kick count", "kicks", "kicking"], use: emergency, message: "You have told me you had a stillbirth before. Any change in your baby's movements needs to be checked immediately, day or night.", src: [rcog, nhs-movements]}
  # ---- Mental health and other conditions ----
  - {id: cond-depression-meds, when: {conditions: [depression]}, action: caution, title: Depression, anxiety and medicines, terms: [medicine, medication, tablet, tablets, antidepressant, antidepressants, "stop", "stopping", "side effects", "withdrawal", "breastfeeding", "दवा", "गोली", "દવા", "ગોળી"], message: "You have told me you have depression or anxiety. Stopping antidepressants suddenly can make you ill, and untreated depression also affects pregnancy. Please decide any change with your doctor, not alone.", src: [acog, tele-manas]}
  - {id: cond-sickle-crisis, when: {conditions: [sickle_cell]}, action: block, title: Sickle cell pain or dehydration, terms: [pain, "bone pain", "joint pain", "chest pain", "crisis", "dehydrated", "dehydration", "fever", "vomiting", "high altitude", "hills", "cold", "fasting", "दर्द", "દુખાવો"], message: "You have told me you have sickle cell disease. Pain, fever, chest symptoms or dehydration can start a crisis, which needs hospital treatment quickly. Drink plenty of fluids, keep warm, avoid long fasts and call your doctor or go to hospital today.", src: [acog, rcog, mohfw]}
  - {id: cond-thal-iron, when: {conditions: [thalassemia, sickle_cell]}, action: block, title: Iron tablets with thalassaemia, terms: [iron, ifa, "iron tablet", "iron tablets", "iron syrup", "iron injection", "iron supplement", "ifa tablet", "folic acid", "red tablet", "आयरन", "આયર્ન"], message: "You have told me you have thalassaemia or sickle cell disease. Do not take iron tablets or injections unless your doctor has checked your iron stores (ferritin): some people with these conditions already have too much iron, which can damage the heart and liver, while others need it. Your doctor will decide.", src: [rcog, mohfw, who-anc]}
  - {id: cond-obesity-weight, when: {conditions: [obesity]}, action: caution, title: Obesity and weight in pregnancy, terms: ["weight gain", "gain weight", "lose weight", "losing weight", "weight loss", "diet", "dieting", "bmi", "how much weight", "overweight", "वज़न", "वजन", "વજન"], message: "You have told me you are overweight. The right amount of weight gain in pregnancy depends on your starting weight and is set with your doctor; don't diet or fast to lose weight now. You may be offered an early diabetes test and extra blood-pressure checks.", src: [acog, nhs-pregnancy, nhs-gdm]}
  - {id: cond-clotting-immobility, when: {conditions: [clotting]}, action: caution, title: Clotting disorder, travel and heparin, terms: [flight, flying, travel, "long journey", "long drive", "train journey", "bus journey", "sitting for long", "bed rest", "immobile", "heparin", "injection", "enoxaparin", "aspirin", "swollen leg", "leg pain"], message: "You have told me you have a clotting disorder or a past clot. Long journeys, bed rest and dehydration raise your risk in pregnancy. Never skip a blood-thinner injection, move and drink fluids regularly on journeys, and tell your doctor about a swollen or painful leg or any breathlessness at once.", src: [rcog, acog, nhs-dvt]}
  - {id: cond-migraine-new-headache, when: {conditions: [migraine]}, action: caution, title: Migraine and a new kind of headache, terms: [headache, migraine, "head pain", "sir dard", "सिरदर्द", "માથાનો દુખાવો"], message: "You have told me you get migraines. Migraines can change in pregnancy, but a headache that is new, severe, unusual for you, or comes with vision changes or swelling after 20 weeks needs same-day assessment because it can be pre-eclampsia. Please don't take any migraine medicine without your doctor's advice.", src: [nhs-preeclampsia, acog]}
  - {id: cond-lupus-flare, when: {conditions: [lupus]}, action: caution, title: Autoimmune disease and medicines, terms: [flare, "joint pain", "rash", "stop", "medicine", "medication", "tablet", "tablets", "hydroxychloroquine", "prednisolone", "steroid", "aspirin", "heparin"], message: "You have told me you have lupus or another autoimmune condition. Flares in pregnancy raise the risk of complications, and stopping your medicines can trigger one. Please plan any change with your rheumatologist and obstetrician together.", src: [acog, rcog]}
  - {id: cond-uti-recurrent, when: {conditions: [uti]}, action: caution, title: Urine infection history, terms: [burning, "urine", "pee", "peeing", "urinating", "back pain", "fever", "antibiotic", "antibiotics", "water intake", "cranberry"], message: "You have told me you have had urine infections. In pregnancy they can silently spread to the kidneys, so ask for a urine culture at your visits, drink plenty of water, and call your doctor the same day for burning, fever or back pain.", src: [acog, nhs-pregnancy]}
  - {id: cond-gerd-meds, when: {conditions: [gerd]}, action: caution, title: Acid reflux and medicines, terms: [antacid, "acidity tablet", "gas tablet", "pantoprazole", "omeprazole", "ranitidine", "gelusil", "digene", "eno", "pan d", "reflux medicine", "heartburn medicine", "heartburn tablet"], message: "You have told me you get acid reflux. Small meals, not lying down after eating and raising the head of the bed often help. Please check any antacid or acid-reducing tablet with your doctor first, since some contain sodium or aluminium and some are not suitable.", src: [nhs-pregnancy, acog]}
  # ---- Age ----
  - {id: cond-age-teen, when: {risk_factors: [age_under_18]}, action: caution, title: Pregnancy under 18, terms: [pregnancy, pregnant, baby, delivery, scan, checkup, check-up, anc, diet, exercise, medicine, "reduce"], message: "Because you are under 18, your pregnancy needs extra care: please attend every antenatal visit at a government hospital or health centre, take your iron and folic acid, eat well, and tell your doctor or ASHA about anything that worries you. You can talk to them privately.", src: [who-anc, nhm]}
  - {id: cond-age-35, when: {risk_factors: [age_35_plus]}, action: caution, title: Pregnancy at 35 or older, terms: [pregnancy, pregnant, scan, screening, test, tests, "down syndrome", "genetic", "amniocentesis", "nipt", "double marker", "quad", "anomaly scan"], message: "At 35 or older, doctors usually offer extra checks, such as blood-pressure and diabetes screening and the option of screening for conditions like Down syndrome. Ask your doctor which are right for you.", src: [acog, rcog]}
  # ---- Rh-negative ----
  - {id: cond-rh-neg-events, when: {risk_factors: [rh_negative]}, action: block, title: Rh-negative and bleeding or injury, terms: [bleeding, spotting, fall, fell, injury, "hit in the stomach", "hit on the belly", accident, miscarriage, "abortion", "amniocentesis"], message: "You have told me your blood group is Rh-negative. After any bleeding, fall, injury, procedure or miscarriage you may need an anti-D injection within 72 hours so that your body doesn't make antibodies that could harm this or a future baby. Please contact your doctor today.", src: [rcog, acog]}
  - {id: cond-smoker-quit, when: {risk_factors: [smoker]}, action: caution, title: Smoking, vaping or chewing tobacco, terms: [smoking, cigarette, cigarettes, beedi, bidi, hookah, vape, vaping, gutka, gutkha, khaini, tobacco, "paan", nicotine, quit, quitting], message: "You have told me you smoke or use tobacco. Stopping at any point in pregnancy helps your baby, and it is never too late. Please tell your doctor; they can help you stop safely, including with counselling, and without judgement.", src: [nhs-smoking, who-tobacco, acog]}
  - {id: cond-ivf-bleeding, when: {risk_factors: [ivf]}, action: caution, title: IVF pregnancy and progesterone, terms: [progesterone, pessary, injection, "stop progesterone", "stopping progesterone", "duphaston", "susten", "crinone", "utrogestan", "bleeding", "spotting"], message: "You have told me this pregnancy came through IVF or fertility treatment. Please continue the medicines your fertility team prescribed until they tell you to stop, and don't change or stop them yourself.", src: [rcog, acog]}
