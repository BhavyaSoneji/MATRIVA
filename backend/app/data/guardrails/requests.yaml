    message: "If you are thinking about ending a pregnancy, please don't use pills, herbs or home methods: they can cause heavy bleeding, infection and death. In India, abortion is legal under the MTP Act (amended 2021): up to 20 weeks on the opinion of one registered doctor, and up to 24 weeks in certain situations, at a government-approved centre. A doctor or your ASHA/ANM can explain your options privately. If you are bleeding heavily or in severe pain, call 112 now. If someone is forcing you, call the Women Helpline 181."
    localized:
      hi: "अगर आप गर्भ समाप्त करने के बारे में सोच रही हैं, तो कृपया गोलियों, जड़ी-बूटियों या घरेलू तरीक़ों का इस्तेमाल न करें: इनसे तेज़ ख़ून बहना, संक्रमण और मौत हो सकती है। भारत में MTP अधिनियम (2021 संशोधित) के तहत गर्भपात क़ानूनी है: एक पंजीकृत डॉक्टर की राय पर 20 हफ़्ते तक, और कुछ परिस्थितियों में 24 हफ़्ते तक, सरकार से मान्यता प्राप्त केंद्र में। डॉक्टर या आपकी आशा/ANM आपके विकल्प निजी तौर पर समझा सकती हैं। तेज़ ब्लीडिंग या तेज़ दर्द हो तो अभी 112 पर कॉल करें। कोई मजबूर कर रहा हो तो महिला हेल्पलाइन 181 पर कॉल करें।"
      gu: "જો તમે ગર્ભ સમાપ્ત કરવા વિશે વિચારી રહ્યા છો, તો કૃપા કરીને ગોળીઓ, જડીબુટ્ટીઓ કે ઘરેલું રીતોનો ઉપયોગ ન કરો: તેનાથી ભારે રક્તસ્રાવ, ચેપ અને મૃત્યુ થઈ શકે. ભારતમાં MTP અધિનિયમ (2021 સુધારેલ) હેઠળ ગર્ભપાત કાયદેસર છે: એક નોંધાયેલા ડૉક્ટરના અભિપ્રાયે 20 અઠવાડિયા સુધી, અને કેટલીક પરિસ્થિતિઓમાં 24 અઠવાડિયા સુધી, સરકાર માન્ય કેન્દ્રમાં. ડૉક્ટર કે તમારી આશા/ANM તમારા વિકલ્પો ખાનગીમાં સમજાવી શકે. ભારે રક્તસ્રાવ કે તીવ્ર દુખાવો થાય તો હમણાં 112 પર કૉલ કરો. કોઈ દબાણ કરતું હોય તો મહિલા હેલ્પલાઇન 181 પર કૉલ કરો."
    src: [mtp-act, mohfw, helpline-181]
