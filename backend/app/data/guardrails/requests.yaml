    message: "I can't help with finding out or predicting a baby's sex. In India, telling or finding out the sex of an unborn baby is illegal under the PCPNDT Act, 1994. Scans are for checking your baby's health and growth. If you are being pressured about the baby's sex, you can call the Women Helpline 181."
    localized:
      hi: "मैं बच्चे का लिंग पता करने या बताने में मदद नहीं कर सकती। भारत में PCPNDT अधिनियम, 1994 के तहत गर्भ में पल रहे बच्चे का लिंग बताना या पता करना अवैध है। स्कैन आपके बच्चे की सेहत और विकास जाँचने के लिए होते हैं। अगर बच्चे के लिंग को लेकर आप पर दबाव डाला जा रहा है, तो महिला हेल्पलाइन 181 पर कॉल करें।"
