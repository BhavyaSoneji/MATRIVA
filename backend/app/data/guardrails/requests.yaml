    message: "Please don't try to start labour at home with herbs, oils, foods or tablets. This can cause very strong, harmful contractions or bleeding. If you are past your due date or worried, your doctor or midwife can talk to you about safe options, including induction in hospital. If you have contractions, bleeding or your waters break, go to the hospital."
