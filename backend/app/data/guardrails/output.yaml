# Checks on the bot's own answer before it is shown. A failing answer is replaced, never trimmed.
rules:
  - {id: out-dose-given, action: block, check: dose, title: Gives a dose for a medicine, patterns: ["\\b\\d+(\\.\\d+)?\\s?(mg|mcg|µg|ug|g|ml|iu|units?)\\b", "\\b(once|twice|thrice)\\s+(a|per|every)\\s+(day|daily|night|week)\\b", "\\b\\d+\\s+times?\\s+(a|per)\\s+day\\b", "\\bevery\\s+\\d+\\s+hours?\\b", "\\b(one|two|three|1|2|3)\\s+(tablet|tablets|pill|pills|capsule|capsules|teaspoon|teaspoons|tsp|tablespoon|tablespoons)\\b", "\\bfor\\s+\\d+\\s+(days?|weeks?)\\b.*\\b(tablet|capsule|course)\\b"], allow: [iron, ifa, "folic acid", folate, calcium, "vitamin d", "vitamin b12", "vitamin c", "vitamin a", protein, carbohydrate, fibre, fiber, fat, zinc, magnesium, iodine, sodium, potassium, caffeine, calories, kcal, energy, water, fluid, fluids, milk, "ors", "oral rehydration"], src: [nhs-medicines]}
  - {id: out-safe-claim, action: block, check: safe_claim, title: Calls a medicine safe, patterns: ["\\bis safe\\b", "\\bare safe\\b", "\\bsafe to take\\b", "\\bsafe to use\\b", "\\bsafe in pregnancy\\b", "\\bsafe during pregnancy\\b", "\\bsafe for pregnant\\b", "\\bgenerally safe\\b", "\\bconsidered safe\\b", "\\busually safe\\b", "\\bperfectly safe\\b", "\\bcompletely safe\\b", "\\byou can take\\b", "\\byou may take\\b", "\\byou can use\\b", "\\byou can safely take\\b", "\\bok to take\\b", "\\bokay to take\\b", "\\bfine to take\\b", "\\bgo ahead and take\\b", "\\bshould take\\b", "\\bi recommend taking\\b", "\\bi suggest taking\\b", "\\btry taking\\b", "\\bstart taking\\b", "\\bcan be taken\\b"], src: [nhs-medicines]}
  - {id: out-avoided-medicine-unqualified, action: block, check: avoided_medicine, title: Names a medicine to avoid without a warning, patterns: [], src: [nhs-medicines]}
  - {id: out-induce-instructions, action: block, check: induce, title: Explains how to start labour, a period or an abortion, patterns: ["\\b(to|can|will|may|help)\\s+(induce|start|bring on|trigger|kick ?start)\\s+(your\\s+)?(labou?r|contractions|a period|your period|periods|a miscarriage|an abortion|abortion|miscarriage)\\b.*\\b(take|drink|eat|use|try|insert|apply|boil|swallow)\\b", "\\b(take|drink|eat|use|try|insert|apply|boil|swallow)\\b.*\\b(to|so that|in order to)\\s+(induce|start|bring on|trigger|cause)\\s+(labou?r|contractions|a period|your period|a miscarriage|an abortion|abortion|miscarriage)\\b", "\\bhow to (abort|miscarry|terminate)\\b.*\\b(at home|yourself|with)\\b"], src: [mtp-act, acog]}
  - {id: out-diagnosis, action: block, check: diagnosis, title: Diagnoses the person, patterns: ["\\byou (definitely |certainly |probably |likely |clearly |obviously )?(have|are suffering from|suffer from|are having|are experiencing) (pre-?eclampsia|eclampsia|gestational diabetes|diabetes|anaemia|anemia|an infection|a urine infection|a uti|hypertension|high blood pressure|a miscarriage|an ectopic|placenta previa|placenta praevia|placental abruption|cholestasis|preterm labou?r|thyroid|hypothyroidism|hyperthyroidism|depression|anxiety|a blood clot|dvt|a kidney infection|dengue|malaria|typhoid|covid|the flu|influenza|hiv|syphilis|hepatitis)\\b", "\\bthis is (definitely|certainly|clearly|obviously|surely) (pre-?eclampsia|a miscarriage|an infection|nothing serious|normal)\\b", "\\byour (symptoms|signs) (mean|show|indicate|confirm) (that )?you (have|are)\\b", "\\bi (can )?diagnose\\b", "\\bmy diagnosis\\b"], src: [acog]}
  - {id: out-gender-prediction, action: block, check: gender, title: Predicts the baby's sex, patterns: ["\\b(you are|you're|you will be|you might be|you may be|you seem to be) (having|carrying|expecting) (a )?(boy|girl|son|daughter|baby boy|baby girl)\\b", "\\bsigns? (of|that) (it is |it's |you are having |you're having |you are carrying |you're carrying )?(a )?(boy|girl|baby boy|baby girl)\\b", "\\b(boy|girl) (is more likely|is likely|if|when) (your|you|the) (belly|bump|cravings|heart rate|morning sickness)\\b", "\\bheart ?rate (above|over|below|under) \\d+ (means|is a sign|indicates|suggests) (a )?(boy|girl)\\b", "\\bcarrying high (means|is a sign|indicates|suggests) (a )?(boy|girl)\\b"], src: [pcpndt]}
  - {id: out-guarantee, action: block, check: guarantee, title: Promises a cure or no risk, patterns: ["\\bguarantee[sd]?\\b", "\\b100% (safe|effective|sure|certain|natural)\\b", "\\bno risk\\b", "\\bzero risk\\b", "\\brisk[- ]free\\b", "\\bwithout any risk\\b", "\\bwill (definitely|certainly|surely) (cure|heal|prevent|treat|work|help)\\b", "\\bcures?\\b", "\\bwill cure\\b", "\\bwill heal\\b", "\\bwill prevent\\b", "\\bwill treat\\b", "\\bwill make (your|the) baby\\b", "\\bmakes? (your|the) baby (smarter|fair|fairer|stronger|healthier|intelligent|beautiful)\\b", "\\bclinically proven\\b", "\\bscientifically (proven|confirmed)\\b", "\\bmedically (proven|guaranteed)\\b", "\\bmiracle\\b"], src: [acog, ayush]}
  - {id: out-false-reassurance, action: block, check: reassurance, title: False reassurance, patterns: ["\\bnothing to worry about\\b", "\\bno need to worry\\b", "\\bnothing to be worried about\\b", "\\bdont worry about it\\b", "\\bdon't worry about it\\b", "\\bdo not worry about it\\b", "\\bis nothing serious\\b", "\\bnot serious\\b", "\\bno cause for concern\\b", "\\bno need to see a doctor\\b", "\\bno need to call\\b", "\\byou do not need (a doctor|medical|to see)\\b", "\\byou don't need (a doctor|medical|to see)\\b", "\\bignore (it|this|the symptom|the symptoms|the pain|the bleeding)\\b", "\\bsafe to ignore\\b", "\\bsafe to skip\\b", "\\bwait and see\\b", "\\bwait it out\\b", "\\bwill pass on its own\\b", "\\bwill go away on its own\\b"], src: [acog, who-anc]}
  - {id: out-stop-medicine, action: block, check: stop, title: Tells the person to stop or change a medicine, patterns: ["\\b(stop|skip|discontinue|reduce|increase|double|halve|change|switch) (taking )?(your|the) (medicine|medication|tablets?|pills?|insulin|dose|injection|treatment|inhaler)\\b", "\\bstop taking\\b", "\\bno longer need (your|the) (medicine|medication|tablets?)\\b", "\\byou can (stop|skip|come off)\\b"], src: [nhs-medicines, acog]}
  - {id: out-replace-care, action: block, check: replace, title: Suggests home treatment instead of care, patterns: ["\\b(instead of|rather than|no need for) (seeing|visiting|going to|consulting|calling) (a |the |your )?(doctor|hospital|clinic|midwife|anm|asha)\\b", "\\bhome remed(y|ies) (will|can|should|are enough|is enough)\\b", "\\btreat (it|this|yourself) at home\\b", "\\bcure (it|this) at home\\b", "\\bno need for (a )?(scan|test|checkup|check-up|ultrasound|anc)\\b"], src: [who-anc, nhm]}
  - {id: out-dangerous-substance, action: block, check: substance, title: Endorses alcohol, tobacco or drugs, patterns: ["\\b(a little|a small amount of|one|some|occasional|moderate|light) (alcohol|wine|beer|whisky|whiskey|rum|vodka|drink|drinks|smoking|cigarette|cigarettes|beedi|bidi|cannabis|ganja|bhang|tobacco)\\b.*\\b(is|are) (fine|ok|okay|safe|harmless|acceptable|allowed)\\b", "\\b(alcohol|wine|beer|smoking|cigarettes?|cannabis|ganja|bhang|tobacco) (is|are) (fine|ok|okay|safe|harmless|acceptable|allowed) (in|during) pregnancy\\b", "\\byou can (drink|smoke|have a drink|have a cigarette|chew tobacco)\\b"], src: [nhs-alcohol, nhs-smoking, who-alcohol, who-tobacco]}
  - {id: out-sex-determination, action: block, check: sexdet, title: Helps determine the baby's sex, patterns: ["\\b(scan|ultrasound|sonography|test|blood test|nipt) (can|will|to) (tell|show|reveal|determine|find out) (you )?(the )?(sex|gender)\\b", "\\bhow to (find out|know|determine|predict) (the )?(sex|gender) of (your|the) baby\\b"], src: [pcpndt]}
