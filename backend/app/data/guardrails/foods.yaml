# Food and drink cautions, one rule per food. Each says why, in one line, and where it comes from. They warn and let the
# answer continue; they never forbid a whole diet.
groups:
  - {"cls": "avoid_substance", "src": ["nhs-foods", "cdc-listeria"], "items": [
      {"name": "liver pate", "aka": ["pate", "paté", "liver paste", "foie gras", "meat pate", "vegetable pate"], "why": "pâté can carry listeria and liver pâté is very high in vitamin A; both are advised against in pregnancy"},
      {"name": "smoked salmon", "aka": ["smoked fish", "lox", "gravlax", "cold smoked fish", "smoked trout", "smoked mackerel"], "why": "cold-smoked fish can carry listeria; cooked or canned versions are the safer choice"},
      {"name": "raw oysters", "aka": ["oysters raw", "raw shellfish", "raw clams", "raw mussels", "raw scallops", "oyster"], "why": "raw shellfish can carry bacteria and viruses that cause serious food poisoning; cook shellfish until steaming hot"},
      {"name": "sushi", "aka": ["sashimi", "raw fish", "nigiri", "poke bowl", "ceviche", "raw salmon", "raw tuna", "crudo", "tartare fish", "kinilaw"], "why": "raw fish can carry parasites and bacteria; sushi made with cooked fish or vegetables is the safer choice"},
      {"name": "rare steak", "aka": ["rare meat", "medium rare", "undercooked steak", "steak tartare", "carpaccio", "pink meat", "bloody steak", "undercooked beef"], "why": "undercooked meat can carry toxoplasma and bacteria; cook until there is no pink and the juices run clear"},
      {"name": "undercooked pork", "aka": ["pink pork", "raw pork", "rare pork", "undercooked ham", "undercooked bacon", "raw ham"], "why": "undercooked pork can carry parasites and bacteria; cook it right through"},
      {"name": "undercooked chicken", "aka": ["pink chicken", "raw chicken", "rare chicken", "undercooked poultry", "raw poultry", "half cooked chicken"], "why": "undercooked poultry can carry salmonella and campylobacter; cook it right through"},
      {"name": "deli meats", "aka": ["cold cuts", "deli meat", "salami", "hot dogs", "hot dog", "luncheon meat", "bologna", "sausage rolls cold", "ham slices", "cured meats", "prosciutto", "parma ham", "chorizo", "pepperoni", "pastrami", "corned beef cold"], "why": "cold or uncooked processed meats can carry listeria; eat them only when cooked until steaming hot"},
      {"name": "raw eggs", "aka": ["runny egg", "runny eggs", "undercooked egg", "soft boiled egg", "half boiled egg", "sunny side up", "poached egg", "raw egg yolk", "raw egg white", "kachcha anda", "egg flip", "eggnog", "egg nog"], "why": "raw or runny eggs can carry salmonella; cook eggs until the white and yolk are firm"},
      {"name": "homemade mayonnaise", "aka": ["raw egg mayonnaise", "homemade mayo", "aioli", "hollandaise", "bearnaise", "caesar dressing homemade", "raw egg sauce"], "why": "sauces made with raw egg can carry salmonella; shop-bought pasteurised versions are safer"},
      {"name": "raw cookie dough", "aka": ["cookie dough", "raw cake batter", "cake batter", "raw batter", "licking the bowl", "uncooked batter", "raw brownie batter"], "why": "raw dough and batter contain raw egg and sometimes raw flour, which can carry bacteria"},
      {"name": "tiramisu", "aka": ["mousse homemade", "chocolate mousse", "homemade ice cream raw egg", "zabaglione", "meringue soft", "soft meringue", "royal icing raw egg", "raw egg dessert"], "why": "desserts made with raw egg can carry salmonella unless the egg is pasteurised"},
      {"name": "brie", "aka": ["camembert", "mould ripened cheese", "mold ripened cheese", "rind cheese", "soft ripened cheese", "chevre", "goats cheese rind", "goat cheese rind", "vacherin", "tallegio", "taleggio"], "why": "soft mould-ripened cheeses can carry listeria unless cooked until steaming hot"},
      {"name": "blue cheese", "aka": ["roquefort", "gorgonzola", "stilton", "danish blue", "dolcelatte", "cambozola", "blue vein cheese"], "why": "blue cheeses can carry listeria unless cooked until steaming hot"},
      {"name": "queso fresco", "aka": ["fresh cheese unpasteurised", "unpasteurised cheese", "unpasteurized cheese", "raw milk cheese", "farmhouse cheese", "cheese from raw milk", "paneer from raw milk", "village paneer", "kachcha paneer"], "why": "cheese made from unpasteurised milk can carry listeria; pasteurised paneer, cottage cheese and processed cheese are the usual advice"},
      {"name": "raw milk", "aka": ["kachcha doodh", "kachha doodh", "dhar ka doodh", "unpasteurised milk", "unpasteurized milk", "milk straight from the animal", "farm milk", "village milk unboiled", "unboiled milk", "unheated milk", "raw cow milk", "raw buffalo milk", "raw goat milk", "kaccha doodh", "कच्चा दूध", "કાચું દૂધ"], "why": "unpasteurised milk can carry listeria, brucella and other germs; boil milk before drinking"},
      {"name": "unpasteurised juice", "aka": ["unpasteurized juice", "fresh cider", "unpasteurised cider", "street juice", "juice from vendor", "cold pressed juice unpasteurised", "fresh pressed juice street", "sugarcane juice from vendor", "ganne ka ras street", "sugarcane juice street"], "why": "unpasteurised or street juices can carry bacteria such as E. coli and salmonella"},
      {"name": "raw sprouts", "aka": ["alfalfa sprouts", "bean sprouts", "mung sprouts raw", "moong sprouts raw", "raw sprouted gram", "uncooked sprouts", "sprouts salad raw", "raw sprouts salad", "kachi sprouts", "sprouts chaat raw", "raw sprouted moong", "radish sprouts", "clover sprouts"], "why": "raw sprouts can carry salmonella and E. coli because the warm, moist growing conditions suit bacteria; cook them until steaming hot"},
      {"name": "pre-cut melon", "aka": ["cut melon", "cantaloupe", "pre cut fruit", "cut fruit from vendor", "cut watermelon street", "fruit chaat vendor", "cut fruit left out", "sliced melon", "cut papaya street", "fruit salad street", "pre-cut fruit"], "why": "melon rind and cut fruit left unrefrigerated can carry listeria and salmonella; wash fruit and cut it yourself"},
      {"name": "leftover rice", "aka": ["stale rice", "rice left out overnight", "bassi chawal", "basi chawal", "reheated rice", "old rice", "fried rice leftover", "rice left on counter", "bassi khana", "basi khana", "stale food", "leftover food", "old food", "fridge food days old", "bassi roti", "stale roti"], "why": "rice and other food left at room temperature can grow Bacillus cereus and other bacteria that cause food poisoning; refrigerate leftovers quickly and reheat until steaming hot"},
      {"name": "pani puri water", "aka": ["golgappa water", "panipuri water", "puchka water", "pani puri from vendor", "street pani puri", "street golgappa", "street panipuri", "gol gappa", "puchka", "phuchka", "pani puri street", "pani puri", "panipuri", "golgappe", "gupchup"], "why": "street pani puri water is often made with untreated water and can cause typhoid, hepatitis and severe diarrhoea; homemade with boiled water is safer"},
      {"name": "ice from vendors", "aka": ["ice gola", "gola", "ice from street", "street ice", "ice cubes street", "unsafe ice", "ice in juice vendor", "block ice", "barf ka gola", "ice candy street", "kulfi street", "street kulfi", "street ice cream", "falooda street", "rabri falooda street"], "why": "ice and cold treats from street vendors can be made with untreated water and cause stomach infections"},
      {"name": "untreated water", "aka": ["tap water", "borewell water", "well water", "unfiltered water", "unboiled water", "river water", "pond water", "kachha pani", "bore water", "hand pump water", "handpump water", "stored water old", "tanker water", "stream water", "lake water", "sea water drinking", "ground water"], "why": "untreated water can carry bacteria, viruses and parasites; drink boiled and cooled or properly filtered water"},
      {"name": "wheatgrass", "aka": ["wheat grass", "wheatgrass juice", "wheat grass juice", "wheatgrass shot", "barley grass", "barley grass juice", "green juice raw", "raw green juice", "grass juice"], "why": "raw grass juices can carry bacteria and mould and are not well studied in pregnancy"},
      {"name": "kombucha", "aka": ["kombucha tea", "fermented tea", "kefir", "water kefir", "tepache", "kvass", "fermented drink", "jun tea", "raw fermented drink", "home fermented drink", "kanji unpasteurised", "kanji"], "why": "kombucha and similar fermented drinks are usually unpasteurised and can contain traces of alcohol and bacteria"},
      {"name": "raw papaya", "aka": ["unripe papaya", "green papaya", "kachha papita", "kaccha papita", "papaya raw", "raw papaya juice", "papaya sabzi raw", "papaya latex", "papain", "papaya seeds", "papaya leaf juice", "semi ripe papaya", "half ripe papaya"], "why": "unripe or semi-ripe papaya contains latex and papain that may trigger contractions, so it is advised against; fully ripe papaya is a separate question to ask your doctor"},
      {"name": "alcohol-containing food", "aka": ["alcohol in food", "wine sauce", "rum cake", "beer batter", "liqueur chocolate", "brandy sauce", "vanilla extract alcohol", "tiramisu alcohol", "rum balls", "wine in cooking", "alcohol cooked", "flambe", "flambé", "cooking wine", "sherry trifle", "boozy dessert"], "why": "no safe level of alcohol is known in pregnancy, and cooking does not always remove all of it"},
      {"name": "supari", "aka": ["betel nut", "areca nut", "betel quid", "paan", "paan masala", "supari tobacco", "tambul", "mouth freshener supari", "meetha paan", "sweet paan", "mukhwas supari", "sugandhi supari", "सुपारी", "પાન", "સોપારી"], "why": "areca nut (supari) and betel quid are linked to cancer and to harm in pregnancy; paan with tobacco is much worse"}
    ]}
  - {"cls": "limit_substance", "src": ["nhs-foods", "fda-fish", "acog", "icmr-nin"], "items": [
      {"name": "tea", "aka": ["chai", "masala chai", "kadak chai", "cutting chai", "black tea", "iced tea", "milk tea", "चाय", "ચા"], "why": "tea contains caffeine and also reduces iron absorption; keep total caffeine under 200 mg a day, about two cups, and have tea away from your iron tablet"},
      {"name": "tuna", "aka": ["canned tuna", "tuna steak", "fresh tuna", "bluefin tuna", "bigeye tuna", "albacore", "tuna sandwich", "tuna salad", "tuna fish", "skipjack", "yellowfin tuna", "tuna can", "tuna tin", "light tuna", "white tuna"], "why": "tuna contains more mercury than most fish; the FDA suggests limiting canned light tuna and avoiding bigeye tuna, and the NHS advises no more than two tuna steaks or four cans a week"},
      {"name": "shark", "aka": ["swordfish", "king mackerel", "marlin", "tilefish", "orange roughy", "shark meat", "shark fin", "shark steak", "swordfish steak", "mako shark", "kingfish", "blue marlin", "gulper shark"], "why": "these large fish are high in mercury, which can harm a baby's developing brain, and the FDA advises avoiding them in pregnancy"},
      {"name": "oily fish", "aka": ["mackerel", "sardines", "salmon", "trout", "herring", "pilchards", "sardine", "bangda", "bangdo", "tarli", "hilsa", "ilish", "rohu oily", "pomfret oily", "fresh sardines", "canned sardines", "canned salmon", "oily fish twice", "fish oil from fish"], "why": "oily fish is healthy but contains pollutants; the NHS advises no more than two portions a week in pregnancy"},
      {"name": "vitamin A foods", "aka": ["cod liver oil", "liver supplement", "vitamin a supplement", "retinol supplement", "vitamin a rich food", "fish liver oil", "halibut liver oil", "shark liver oil", "liver oil", "beef liver", "chicken liver", "goat liver", "mutton liver", "kaleji", "कलेजी", "કલેજી"], "why": "too much preformed vitamin A from liver, liver products and some supplements can harm the baby; plant sources such as carrots and spinach are fine"}
    ]}
