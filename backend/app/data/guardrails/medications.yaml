# One rule per medicine (or per small group that shares one reason). Terms are the generic name plus the brand and
# local names people actually type. cls: contraindicated | avoid | doctor_only | otc_ask | supplement | herbal
# (see classes.yaml). `why` is a short, defensible reason, never dosing advice. Nothing here is clinically signed off.
rules:
  - {"name": "isotretinoin", "aka": ["accutane", "roaccutane", "isotroin", "sotret", "oral retinoid", "आइसोट्रेटिनोइन"], "cls": "contraindicated", "why": "a retinoid that causes serious birth defects", "src": ["fda-labeling", "mothertobaby"]}
  - {"name": "acitretin", "aka": ["soriatane", "neotigason"], "cls": "contraindicated", "why": "a retinoid that causes serious birth defects", "src": ["fda-labeling", "mothertobaby"]}
  - {"name": "tretinoin", "aka": ["oral tretinoin"], "cls": "contraindicated", "why": "a retinoid that can cause birth defects when taken by mouth", "src": ["fda-labeling"]}
  - {"name": "alitretinoin", "aka": ["toctino"], "cls": "contraindicated", "why": "a retinoid that causes serious birth defects", "src": ["fda-labeling"]}
  - {"name": "bexarotene", "aka": ["targretin"], "cls": "contraindicated", "why": "a retinoid that causes serious birth defects", "src": ["fda-labeling"]}
  - {"name": "thalidomide", "aka": ["thalix", "thalomid", "थैलिडोमाइड"], "cls": "contraindicated", "why": "causes severe limb and organ malformations", "src": ["fda-labeling", "mothertobaby"]}
  - {"name": "lenalidomide", "aka": ["revlimid", "lenalid"], "cls": "contraindicated", "why": "related to thalidomide; causes severe birth defects", "src": ["fda-labeling"]}
  - {"name": "pomalidomide", "aka": ["pomalyst"], "cls": "contraindicated", "why": "related to thalidomide; causes severe birth defects", "src": ["fda-labeling"]}
  - {"name": "warfarin", "aka": ["warf", "coumadin", "uniwarfin", "वारफेरिन"], "cls": "contraindicated", "why": "crosses the placenta and can cause birth defects and bleeding; only a specialist may use it in rare cases", "src": ["fda-labeling", "mothertobaby"]}
  - {"name": "acenocoumarol", "aka": ["acitrom", "nicoumalone", "sinthrome"], "cls": "contraindicated", "why": "a warfarin-type blood thinner that can cause birth defects and bleeding", "src": ["fda-labeling"]}
  - {"name": "methotrexate", "aka": ["folitrax", "mtx", "trexall", "methoblastin", "मेथोट्रेक्सेट"], "cls": "contraindicated", "why": "causes miscarriage and birth defects", "src": ["fda-labeling", "mothertobaby"]}
  - {"name": "leflunomide", "aka": ["arava", "lefno"], "cls": "contraindicated", "why": "causes birth defects and needs a washout before pregnancy", "src": ["fda-labeling"]}
  - {"name": "teriflunomide", "aka": ["aubagio"], "cls": "contraindicated", "why": "causes birth defects", "src": ["fda-labeling"]}
  - {"name": "mycophenolate", "aka": ["cellcept", "myfortic", "mycept", "mycophenolic acid"], "cls": "contraindicated", "why": "causes miscarriage and birth defects", "src": ["fda-labeling"]}
  - {"name": "ribavirin", "aka": ["copegus", "rebetol", "ribavirin tablet"], "cls": "contraindicated", "why": "causes birth defects", "src": ["fda-labeling"]}
  - {"name": "misoprostol", "aka": ["cytotec", "misoprost", "मिसोप्रोस्टोल", "મિસોપ્રોસ્ટોલ", "misoprostol tablet"], "cls": "contraindicated", "why": "causes uterine contractions, bleeding and miscarriage; it must never be used without a doctor", "src": ["fda-labeling", "mtp-act"]}
  - {"name": "mifepristone", "aka": ["mifeprex", "mtp kit", "mtp pill", "mt pill", "abortion pill", "abortion kit", "मिफेप्रिस्टोन", "mifepristone tablet"], "cls": "contraindicated", "why": "ends a pregnancy; under Indian law it may only be used under a registered doctor", "src": ["mtp-act"]}
  - {"name": "ace inhibitor", "aka": ["enalapril", "lisinopril", "ramipril", "perindopril", "captopril", "benazepril", "fosinopril", "quinapril", "envas", "listril", "cardace", "coversyl"], "cls": "contraindicated", "why": "can harm the baby's kidneys and cause low amniotic fluid, especially after the first trimester", "src": ["fda-labeling", "nice-hypertension"]}
  - {"name": "angiotensin receptor blocker", "aka": ["losartan", "telmisartan", "valsartan", "olmesartan", "irbesartan", "candesartan", "azilsartan", "telma", "losar", "cozaar", "repace", "olmezest", "sartan"], "cls": "contraindicated", "why": "can harm the baby's kidneys and cause low amniotic fluid, especially after the first trimester", "src": ["fda-labeling", "nice-hypertension"]}
  - {"name": "aliskiren", "aka": ["rasilez", "rasilez tablet", "aliskiren tablet"], "cls": "contraindicated", "why": "can harm the developing baby's kidneys", "src": ["fda-labeling"]}
  - {"name": "sacubitril", "aka": ["entresto", "sacubitril valsartan"], "cls": "contraindicated", "why": "contains an angiotensin blocker that can harm the developing baby", "src": ["fda-labeling"]}
  - {"name": "valproate", "aka": ["valproic acid", "sodium valproate", "divalproex", "valparin", "epilex", "encorate", "depakote", "depakine", "वैल्प्रोएट"], "cls": "contraindicated", "why": "carries a high risk of birth defects and lower IQ; a neurologist must review it before or very early in pregnancy, and it must not be stopped abruptly", "src": ["fda-labeling", "mothertobaby", "nice-hypertension"]}
  - {"name": "fluorouracil", "aka": ["5fu", "5-fu", "efudex"], "cls": "contraindicated", "why": "causes birth defects", "src": ["fda-labeling"]}
  - {"name": "hydroxyurea", "aka": ["hydrea", "cytodrox", "hydroxycarbamide"], "cls": "contraindicated", "why": "can cause birth defects; a specialist must decide in sickle cell disease", "src": ["fda-labeling"]}
  - {"name": "cyclophosphamide", "aka": ["endoxan", "cytoxan"], "cls": "contraindicated", "why": "causes birth defects", "src": ["fda-labeling"]}
  - {"name": "tamoxifen", "aka": ["nolvadex", "tamoxifen"], "cls": "contraindicated", "why": "can cause birth defects and pregnancy loss", "src": ["fda-labeling"]}
  - {"name": "danazol", "aka": ["danocrine", "danogen", "danazol capsule"], "cls": "contraindicated", "why": "can masculinise a female baby", "src": ["fda-labeling"]}
  - {"name": "finasteride", "aka": ["proscar", "propecia", "finpecia", "fincar"], "cls": "contraindicated", "why": "can affect the development of a male baby's genitals; pregnant women should not even handle crushed tablets", "src": ["fda-labeling"]}
  - {"name": "dutasteride", "aka": ["avodart", "dutas"], "cls": "contraindicated", "why": "can affect the development of a male baby's genitals", "src": ["fda-labeling"]}
  - {"name": "testosterone", "aka": ["androgen", "testosterone gel", "testosterone injection", "sustanon", "nandrolone", "anabolic steroid", "steroids for muscle"], "cls": "contraindicated", "why": "can masculinise a female baby", "src": ["fda-labeling"]}
  - {"name": "diethylstilbestrol", "aka": ["diethylstilbestrol tablet"], "cls": "contraindicated", "why": "causes cancers and genital problems in the baby", "src": ["fda-labeling"]}
  - {"name": "ergotamine", "aka": ["cafergot", "ergomar", "ergot"], "cls": "contraindicated", "why": "causes uterine contractions and reduces blood flow to the baby", "src": ["fda-labeling"]}
  - {"name": "dihydroergotamine", "aka": ["migranal"], "cls": "contraindicated", "why": "causes uterine contractions and reduces blood flow to the baby", "src": ["fda-labeling"]}
  - {"name": "miltefosine", "aka": ["impavido", "miltefos", "miltefosine tablet"], "cls": "contraindicated", "why": "causes birth defects", "src": ["fda-labeling"]}
  - {"name": "bosentan", "aka": ["tracleer", "bosentas"], "cls": "contraindicated", "why": "causes birth defects", "src": ["fda-labeling"]}
  - {"name": "ambrisentan", "aka": ["letairis", "volibris"], "cls": "contraindicated", "why": "causes birth defects", "src": ["fda-labeling"]}
  - {"name": "macitentan", "aka": ["opsumit", "macitentan tablet"], "cls": "contraindicated", "why": "causes birth defects", "src": ["fda-labeling"]}
  - {"name": "riociguat", "aka": ["adempas", "riociguat tablet"], "cls": "contraindicated", "why": "causes birth defects", "src": ["fda-labeling"]}
  - {"name": "lomitapide", "aka": ["juxtapid", "lomitapide tablet", "lomitapide capsule"], "cls": "contraindicated", "why": "can harm the developing baby", "src": ["fda-labeling"]}
  - {"name": "vitamin a high dose", "aka": ["retinol", "vitamin a tablet", "vitamin a capsule", "cod liver oil", "liver tablets", "retinyl palmitate"], "cls": "contraindicated", "why": "too much preformed vitamin A can cause birth defects; routine doses above the recommended daily amount should not be taken", "src": ["nhs-medicines", "who-anc"]}
  - {"name": "live vaccine", "aka": ["mmr", "mmr vaccine", "measles vaccine", "rubella vaccine", "varicella vaccine", "chickenpox vaccine", "yellow fever vaccine", "nasal flu vaccine", "fluenz", "bcg vaccine", "oral typhoid vaccine", "mmrv"], "cls": "avoid", "why": "live vaccines are not given during pregnancy; the vaccines recommended in pregnancy are decided by your doctor", "src": ["cdc-pregnancy", "nhs-pregnancy"]}
  - {"name": "ibuprofen", "aka": ["brufen", "advil", "nurofen", "ibugesic", "ibuprofen and paracetamol", "combiflam", "ibuprofen paracetamol", "आइबुप्रोफेन", "ઇબુપ્રોફેન"], "cls": "avoid", "why": "NSAID pain relievers can harm the baby's kidneys and heart vessels, especially from 20 weeks", "src": ["fda-nsaid", "nhs-medicines"]}
  - {"name": "diclofenac", "aka": ["voveran", "voltaren", "dynapar", "diclomax", "voveran sr", "diclo", "डिक्लोफेनाक"], "cls": "avoid", "why": "NSAID pain relievers can harm the baby's kidneys and heart vessels, especially from 20 weeks", "src": ["fda-nsaid"]}
  - {"name": "naproxen", "aka": ["naprosyn", "aleve", "naxdom", "xenobid"], "cls": "avoid", "why": "NSAID pain relievers can harm the baby's kidneys and heart vessels, especially from 20 weeks", "src": ["fda-nsaid"]}
  - {"name": "aceclofenac", "aka": ["zerodol", "hifenac", "zerodol p", "zerodol sp", "dolowin", "acemiz"], "cls": "avoid", "why": "NSAID pain relievers can harm the baby's kidneys and heart vessels, especially from 20 weeks", "src": ["fda-nsaid"]}
  - {"name": "nimesulide", "aka": ["nise", "nimulid", "nimica", "nimsaid", "निमेसुलाइड"], "cls": "avoid", "why": "an NSAID with extra liver safety concerns; avoided in pregnancy", "src": ["fda-nsaid"]}
  - {"name": "mefenamic acid", "aka": ["meftal", "meftal spas", "meftal-p", "ponstan", "mefenamic"], "cls": "avoid", "why": "NSAID pain relievers can harm the baby's kidneys and heart vessels, especially from 20 weeks", "src": ["fda-nsaid"]}
  - {"name": "ketorolac", "aka": ["toradol", "ketorol", "ketorol dt", "ketanov"], "cls": "avoid", "why": "a strong NSAID that should not be used in pregnancy", "src": ["fda-nsaid"]}
  - {"name": "etoricoxib", "aka": ["arcoxia", "nucoxia", "etoshine", "etody"], "cls": "avoid", "why": "NSAID pain relievers can harm the baby's kidneys and heart vessels", "src": ["fda-nsaid"]}
  - {"name": "celecoxib", "aka": ["celebrex", "celact", "celcox"], "cls": "avoid", "why": "NSAID pain relievers can harm the baby's kidneys and heart vessels", "src": ["fda-nsaid"]}
  - {"name": "piroxicam", "aka": ["feldene", "pirox"], "cls": "avoid", "why": "NSAID pain relievers can harm the baby's kidneys and heart vessels", "src": ["fda-nsaid"]}
  - {"name": "indomethacin", "aka": ["indocin", "indocap", "indomethacine"], "cls": "avoid", "why": "can close a baby's heart vessel early; only a specialist uses it for a specific reason", "src": ["fda-nsaid"]}
  - {"name": "ketoprofen", "aka": ["profenid", "oruvail", "ketoprofen gel"], "cls": "avoid", "why": "NSAID pain relievers can harm the baby's kidneys and heart vessels", "src": ["fda-nsaid"]}
  - {"name": "flurbiprofen", "aka": ["froben", "flurbiprofen"], "cls": "avoid", "why": "NSAID pain relievers can harm the baby's kidneys and heart vessels", "src": ["fda-nsaid"]}
  - {"name": "tenoxicam", "aka": ["tilcotil"], "cls": "avoid", "why": "NSAID pain relievers can harm the baby's kidneys and heart vessels", "src": ["fda-nsaid"]}
  - {"name": "lornoxicam", "aka": ["lornoxicam", "xefo"], "cls": "avoid", "why": "NSAID pain relievers can harm the baby's kidneys and heart vessels", "src": ["fda-nsaid"]}
  - {"name": "aspirin", "aka": ["disprin", "colsprin", "loprin", "acetylsalicylic acid", "aspro", "एस्पिरिन", "એસ્પિરિન"], "cls": "avoid", "why": "regular pain-relief doses of aspirin are avoided in pregnancy because they can affect the baby's circulation and cause bleeding", "src": ["fda-nsaid", "nhs-medicines", "nice-hypertension"]}
  - {"name": "pain relief combination", "aka": ["saridon", "novalgin", "analgin", "metamizole", "dipyrone", "propyphenazone", "baralgan"], "cls": "avoid", "why": "combination pain relievers can contain NSAID-type or other ingredients that are avoided in pregnancy", "src": ["fda-nsaid", "nhs-medicines"]}
  - {"name": "tramadol", "aka": ["ultram", "ultracet", "tramazac", "contramal", "tramadol paracetamol", "ट्रामाडोल"], "cls": "avoid", "why": "an opioid; can cause dependence and withdrawal in the newborn", "src": ["fda-labeling", "acog"]}
  - {"name": "codeine", "aka": ["corex", "phensedyl", "codeine syrup", "codeine linctus", "codistar", "tixylix"], "cls": "avoid", "why": "an opioid; can cause breathing problems and dependence in the baby", "src": ["fda-labeling", "acog"]}
  - {"name": "tapentadol", "aka": ["nucynta", "tapal", "tapaday"], "cls": "avoid", "why": "an opioid; can cause dependence and withdrawal in the newborn", "src": ["fda-labeling"]}
  - {"name": "morphine", "aka": ["morphine", "morcontin"], "cls": "avoid", "why": "an opioid; only used in hospital under specialist care", "src": ["fda-labeling"]}
  - {"name": "oxycodone", "aka": ["oxycontin", "oxynorm"], "cls": "avoid", "why": "an opioid; can cause dependence and withdrawal in the newborn", "src": ["fda-labeling"]}
  - {"name": "pentazocine", "aka": ["fortwin", "pentawin"], "cls": "avoid", "why": "an opioid; can cause dependence and withdrawal in the newborn", "src": ["fda-labeling"]}
  - {"name": "buprenorphine", "aka": ["norphin", "buprenex", "subutex", "suboxone"], "cls": "doctor_only", "why": "an opioid used in treating dependence; it must not be stopped abruptly and needs a specialist's plan", "src": ["acog"]}
  - {"name": "doxycycline", "aka": ["doxy", "doxy 1", "doxt", "vibramycin", "doxycycline capsule", "डॉक्सीसाइक्लिन"], "cls": "avoid", "why": "tetracyclines can stain a baby's developing teeth and affect bone growth", "src": ["fda-labeling", "nhs-medicines"]}
  - {"name": "tetracycline", "aka": ["achromycin", "tetracyn", "tetracycline capsule"], "cls": "avoid", "why": "tetracyclines can stain a baby's developing teeth and affect bone growth", "src": ["fda-labeling", "nhs-medicines"]}
  - {"name": "minocycline", "aka": ["minocin", "minoz", "minolox"], "cls": "avoid", "why": "tetracyclines can stain a baby's developing teeth and affect bone growth", "src": ["fda-labeling"]}
  - {"name": "ciprofloxacin", "aka": ["cipro", "ciplox", "ciprobay", "cifran", "quintor", "सिप्रोफ्लॉक्सासिन"], "cls": "avoid", "why": "fluoroquinolone antibiotics are avoided in pregnancy unless a doctor decides there is no alternative", "src": ["fda-labeling"]}
  - {"name": "levofloxacin", "aka": ["levaquin", "levoflox", "tavanic", "glevo", "levomac"], "cls": "avoid", "why": "fluoroquinolone antibiotics are avoided in pregnancy unless a doctor decides there is no alternative", "src": ["fda-labeling"]}
  - {"name": "ofloxacin", "aka": ["tarivid", "zanocin", "oflox", "oflomac", "ofloxacin tablet"], "cls": "avoid", "why": "fluoroquinolone antibiotics are avoided in pregnancy unless a doctor decides there is no alternative", "src": ["fda-labeling"]}
  - {"name": "norfloxacin", "aka": ["norflox", "noroxin", "normax", "norflox tz"], "cls": "avoid", "why": "fluoroquinolone antibiotics are avoided in pregnancy unless a doctor decides there is no alternative", "src": ["fda-labeling"]}
  - {"name": "moxifloxacin", "aka": ["avelox", "moxif", "moxicip", "vigamox"], "cls": "avoid", "why": "fluoroquinolone antibiotics are avoided in pregnancy unless a doctor decides there is no alternative", "src": ["fda-labeling"]}
  - {"name": "gatifloxacin", "aka": ["gatiflo", "tequin"], "cls": "avoid", "why": "fluoroquinolone antibiotics are avoided in pregnancy unless a doctor decides there is no alternative", "src": ["fda-labeling"]}
  - {"name": "gentamicin", "aka": ["garamycin", "genticyn", "gentamycin"], "cls": "avoid", "why": "aminoglycoside antibiotics can damage the baby's hearing", "src": ["fda-labeling"]}
  - {"name": "amikacin", "aka": ["amikin", "mikacin", "amicin"], "cls": "avoid", "why": "aminoglycoside antibiotics can damage the baby's hearing", "src": ["fda-labeling"]}
  - {"name": "streptomycin", "aka": ["streptomycin"], "cls": "avoid", "why": "can damage the baby's hearing; tuberculosis treatment must be planned by a doctor, never stopped alone", "src": ["fda-labeling", "mohfw"]}
  - {"name": "kanamycin", "aka": ["kanamycin"], "cls": "avoid", "why": "can damage the baby's hearing", "src": ["fda-labeling"]}
  - {"name": "neomycin", "aka": ["neosporin", "neomycin"], "cls": "avoid", "why": "aminoglycoside antibiotics can damage the baby's hearing when taken by mouth or injection", "src": ["fda-labeling"]}
  - {"name": "chloramphenicol", "aka": ["chloromycetin", "chlorocol"], "cls": "avoid", "why": "can cause serious problems in the newborn, especially near delivery", "src": ["fda-labeling"]}
  - {"name": "co-trimoxazole", "aka": ["cotrimoxazole", "septran", "bactrim", "sulfamethoxazole", "trimethoprim", "septra", "ctz"], "cls": "avoid", "why": "can interfere with folate early in pregnancy and cause jaundice near delivery", "src": ["fda-labeling", "mothertobaby"]}
  - {"name": "nitrofurantoin", "aka": ["furadantin", "macrobid", "nitrofurantoin", "niftran", "uritin"], "cls": "doctor_only", "why": "doctors sometimes use it for urine infections but avoid it near delivery; only your doctor can decide", "src": ["acog"]}
  - {"name": "sulfadiazine", "aka": ["sulfa", "sulphadiazine"], "cls": "avoid", "why": "sulfa drugs are avoided near delivery and in people with an allergy", "src": ["fda-labeling"]}
  - {"name": "griseofulvin", "aka": ["grisovin", "fulvicin"], "cls": "contraindicated", "why": "an antifungal that can harm the baby", "src": ["fda-labeling"]}
  - {"name": "voriconazole", "aka": ["vfend", "vorizol", "voritrol"], "cls": "avoid", "why": "an antifungal that can harm the baby", "src": ["fda-labeling"]}
  - {"name": "fluconazole", "aka": ["forcan", "zocon", "flucos", "diflucan", "fluka", "candiforce", "फ्लुकोनाज़ोल"], "cls": "avoid", "why": "high or repeated doses are linked to birth defects; a doctor must decide even for a single dose", "src": ["fda-labeling", "mothertobaby"]}
  - {"name": "ketoconazole", "aka": ["nizoral", "ketoconazole tablet", "ketozole"], "cls": "avoid", "why": "taken by mouth it can affect hormones and liver; avoided in pregnancy", "src": ["fda-labeling"]}
  - {"name": "terbinafine", "aka": ["lamisil", "terbicip", "tyza", "sebifin"], "cls": "avoid", "why": "tablets are avoided in pregnancy unless a doctor decides there is no alternative", "src": ["fda-labeling"]}
  - {"name": "itraconazole", "aka": ["sporanox", "itaspor", "canditral", "itrasys"], "cls": "avoid", "why": "has been linked to birth defects; avoided in pregnancy", "src": ["fda-labeling"]}
  - {"name": "albendazole", "aka": ["zentel", "bandy", "alworm", "albenza", "albendazole tablet"], "cls": "avoid", "why": "deworming is avoided in the first trimester; ask your doctor or ANM before any deworming tablet", "src": ["nhm", "who-anc"]}
  - {"name": "mebendazole", "aka": ["vermox", "mebex", "wormin", "mebendazole tablet"], "cls": "avoid", "why": "deworming is avoided in the first trimester; ask your doctor or ANM before any deworming tablet", "src": ["nhm", "who-anc"]}
  - {"name": "ivermectin", "aka": ["ivermectol", "ivecop", "iverheal", "scabo", "ivermectin", "ivermectin tablet"], "cls": "avoid", "why": "not recommended in pregnancy unless a doctor decides the benefit outweighs the risk", "src": ["fda-labeling"]}
  - {"name": "primaquine", "aka": ["malirid", "primaquine"], "cls": "avoid", "why": "can cause blood problems in the baby; malaria treatment in pregnancy must be chosen by a doctor", "src": ["who-anc"]}
  - {"name": "quinine", "aka": ["quinine", "qualaquin", "quinimax"], "cls": "doctor_only", "why": "used for severe malaria only on a doctor's decision", "src": ["who-anc"]}
  - {"name": "mefloquine", "aka": ["lariam", "mefliam"], "cls": "doctor_only", "why": "malaria prevention and treatment in pregnancy must be decided by a doctor", "src": ["who-anc"]}
  - {"name": "tinidazole", "aka": ["tiniba", "tindamax", "fasigyn", "tinidazole"], "cls": "avoid", "why": "usually avoided in the first trimester; ask your doctor", "src": ["fda-labeling"]}
  - {"name": "atenolol", "aka": ["tenormin", "atenolol"], "cls": "avoid", "why": "can slow the baby's growth when used through pregnancy; a doctor may choose another medicine", "src": ["nice-hypertension", "fda-labeling"]}
  - {"name": "spironolactone", "aka": ["aldactone", "spiractin", "aldactone"], "cls": "avoid", "why": "can affect a male baby's development; avoided in pregnancy", "src": ["fda-labeling"]}
  - {"name": "amiodarone", "aka": ["cordarone", "pacerone", "tachyra"], "cls": "avoid", "why": "can harm the baby's thyroid and heart; only a specialist uses it", "src": ["fda-labeling"]}
  - {"name": "rivaroxaban", "aka": ["xarelto", "rivaroxaban", "rivaflo"], "cls": "avoid", "why": "newer blood thinners are avoided in pregnancy; a doctor chooses heparin instead", "src": ["fda-labeling"]}
  - {"name": "apixaban", "aka": ["eliquis", "apixaban"], "cls": "avoid", "why": "newer blood thinners are avoided in pregnancy; a doctor chooses heparin instead", "src": ["fda-labeling"]}
  - {"name": "dabigatran", "aka": ["pradaxa", "dabigatran"], "cls": "avoid", "why": "newer blood thinners are avoided in pregnancy; a doctor chooses heparin instead", "src": ["fda-labeling"]}
  - {"name": "atorvastatin", "aka": ["lipitor", "atorva", "storvas", "atocor", "tonact", "statin", "statins", "rosuvastatin", "rosuvas", "crestor", "simvastatin", "zocor", "pravastatin"], "cls": "avoid", "why": "cholesterol medicines (statins) are usually paused in pregnancy; your doctor decides", "src": ["fda-labeling", "acog"]}
  - {"name": "dapagliflozin", "aka": ["forxiga", "empagliflozin", "jardiance", "canagliflozin", "sglt2", "gliflozin", "dapagliflozin", "oxra", "farxiga", "dapazine", "dapagliflozin tablet"], "cls": "avoid", "why": "not recommended in the second and third trimesters; your doctor will switch your diabetes medicine", "src": ["fda-labeling"]}
