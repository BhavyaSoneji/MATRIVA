# Standing reminders from what the person told us. Shown once at the start of a chat, never repeated every message.
rules:
  - {id: watch-previa, when: {conditions: [placenta_previa]}, action: caution, title: Low-lying placenta, message: "You have told me you have a low-lying placenta. Any vaginal bleeding is an emergency: call 112 and go to hospital.", src: [acog, rcog]}
  - {id: watch-preeclampsia, when: {conditions: [preeclampsia, hypertension], min_week: 20}, action: caution, title: High blood pressure, message: "With high blood pressure, a severe headache, blurred vision, pain under the ribs or sudden swelling after 20 weeks is an emergency: call 112.", src: [nhs-preeclampsia, nice-hypertension]}
  - {id: watch-gdm, when: {conditions: [gestational_diabetes, diabetes]}, action: caution, title: Diabetes, message: "With diabetes in pregnancy, keep to your meal plan, don't skip meals or medicine, and share your blood-sugar readings with your doctor.", src: [nhs-gdm, acog]}
  - {id: watch-rh, when: {risk_factors: [rh_negative]}, action: caution, title: Rh-negative, message: "You are Rh-negative: ask your doctor about anti-D injections around 28 weeks and after any bleeding, fall or delivery.", src: [rcog, acog]}
  - {id: watch-stillbirth, when: {risk_factors: [previous_stillbirth]}, action: caution, title: Previous stillbirth, message: "After a previous stillbirth, report any change in your baby's movements immediately, day or night.", src: [rcog, nhs-movements]}
  - {id: watch-twins, when: {conditions: [twins], risk_factors: [twins]}, action: caution, title: Twins, message: "With twins, labour may start earlier: learn the signs of preterm labour and keep every scan appointment.", src: [nhs-pregnancy, rcog]}
  - {id: watch-age-teen, when: {risk_factors: [age_under_18]}, action: caution, title: Under 18, message: "Please attend every antenatal visit at a government hospital or health centre; your ASHA or ANM can help.", src: [who-anc, nhm]}
  - {id: watch-age-35, when: {risk_factors: [age_35_plus]}, action: caution, title: 35 or older, message: "At 35 or older, ask your doctor about extra checks such as blood-pressure and diabetes screening.", src: [acog, rcog]}
  - {id: watch-smoker, when: {risk_factors: [smoker]}, action: caution, title: Tobacco, message: "Stopping tobacco at any point in pregnancy helps your baby. Your doctor can help you stop safely.", src: [nhs-smoking, who-tobacco]}
  - {id: watch-epilepsy, when: {conditions: [epilepsy]}, action: caution, title: Epilepsy, message: "With epilepsy, never stop seizure medicine on your own, and ask your neurologist about folic acid.", src: [acog]}
  - {id: watch-thal, when: {conditions: [thalassemia, sickle_cell]}, action: caution, title: Thalassaemia or sickle cell, message: "With thalassaemia or sickle cell disease, don't take iron tablets unless your doctor has checked your iron stores.", src: [rcog, mohfw]}
  - {id: watch-hiv, when: {conditions: [hiv]}, action: caution, title: HIV, message: "Take your ART every day as prescribed; plan your delivery with your ART centre.", src: [who-anc, mohfw]}
  - {id: watch-hepb, when: {conditions: [hepatitis_b]}, action: caution, title: Hepatitis B, message: "Tell the delivery team early; your baby needs the hepatitis B vaccine within hours of birth.", src: [who-anc]}
  - {id: watch-prev-cs, when: {conditions: [prev_cesarean], risk_factors: [previous_cesarean]}, action: caution, title: Previous caesarean, message: "After a previous caesarean, plan your delivery with your obstetrician and go to a hospital as soon as labour starts.", src: [acog, rcog]}
  - {id: watch-prev-preterm, when: {conditions: [prev_preterm], risk_factors: [previous_preterm_birth]}, action: caution, title: Previous preterm birth, message: "After a previous early birth, report backache, cramps, pressure or discharge to your doctor the same day.", src: [acog, rcog]}
