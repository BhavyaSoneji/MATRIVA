# Concept lexicon for the local knowledge graph (app/rag/local/graph.py).
#
# Each concept has an id, a display label, a type, and synonyms the text may use. Matching is on
# stemmed, diacritic-folded tokens, so spelling variants of Sanskrit terms (garbha / garbh, kapha / kaphah)
# mostly collapse by themselves. This file contains NO medical claims and no hand-written relations:
# edges between concepts are computed from which concepts co-occur in the reviewed passages, so the
# graph can only say what the knowledge base itself says.
#
# `parent` gives a simple is-a hierarchy (ragi is a millet; millet is a food) used to widen a search.

types:
  nutrient: Nutrient
  food: Food
  symptom: Symptom
  condition: Condition
  practice: Practice & lifestyle
  care: Care & screening
  ayurveda: Ayurveda term
  stage: Stage

